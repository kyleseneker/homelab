name: nut-backport

on:
  pull_request:
    paths: [packaging/nut/**, .github/workflows/nut-backport.yml]
  push:
    branches: [main]
    paths: [packaging/nut/**, .github/workflows/nut-backport.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: bash packaging/nut/build.sh "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nut-debs
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nut-debs
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(dpkg-deb --field dist/nut-server_*_amd64.deb Version)"
          tag="nut-$(echo "$version" | tr '~+' '-.')"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$tag is already published; change LOCAL_REVISION in packaging/nut/build.sh to publish a new build"
            exit 0
          fi
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest=false \
            --title "NUT $version for Debian trixie" \
            --notes "Rebuild of Debian's nut source package for trixie (Proxmox VE 9). See docs/decisions/031-nut-backport.md."
