name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  packer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-packer@1aa358be5cf73883762b302a3a03abd66e75b232 # v3.1.0
      - run: packer fmt -check -recursive packer/
      - working-directory: packer/k8s-node
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh-keygen -q -t ed25519 -N "" -f "$RUNNER_TEMP/packer-key"
          packer init .
          packer validate \
            -var "proxmox_url=https://localhost:8006/api2/json" \
            -var "proxmox_api_token_id=ci@pam!ci" \
            -var "proxmox_api_token_secret=00000000-0000-0000-0000-000000000000" \
            -var "proxmox_node=ci" \
            -var "ssh_public_key=$(cat "$RUNNER_TEMP/packer-key.pub")" \
            -var "ssh_private_key_file=$RUNNER_TEMP/packer-key" \
            -var "iso_checksum=none" \
            .

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      - run: terraform fmt -check -recursive terraform/
      - working-directory: terraform/aws
        run: |
          terraform init -backend=false
          terraform validate
      - working-directory: terraform/hosts/homelabk8s01
        run: |
          terraform init -backend=false
          terraform validate

      - working-directory: terraform/hosts/homelabrestore01
        run: |
          terraform init -backend=false
          terraform validate

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: pip install yamllint
      - run: yamllint -c .yamllint.yml k8s/
      - uses: bmuschko/setup-kubeconform@e5d264ec1eafe2314e750c429a9da7639dd5a003 # v1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - run: pip install pyyaml
      - run: ./scripts/gen-crd-schemas.sh
      - run: |
          kube_version=$(python3 -c 'import yaml; print(yaml.safe_load(open("ansible/group_vars/all/vars.yml"))["k8s_control_plane_version"])')
          kubeconform -strict \
            -kubernetes-version "$kube_version" \
            -schema-location default \
            -schema-location './.crd-schemas/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -skip Kustomization,CustomResourceDefinition \
            -ignore-filename-pattern '.*kustomization\.(yml|yaml)$' \
            -ignore-filename-pattern '.*config\.yml$' \
            -ignore-filename-pattern '.*values\.yml$' \
            -ignore-filename-pattern '.*slack-app-manifest\.json$' \
            -summary \
            k8s/

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2.1.0
        with:
          kustomize-version: "5.8.1"
      - uses: bmuschko/setup-kubeconform@e5d264ec1eafe2314e750c429a9da7639dd5a003 # v1
      - run: pip install pyyaml
      - run: ./scripts/render-manifests.sh

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Scan k8s manifests for misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: k8s/
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table
          trivyignores: .trivyignore.yaml
          version: v0.74.0

  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: pip install ansible-core ansible-lint
      - run: ansible-galaxy collection install -r ansible/requirements.yml
      - working-directory: ansible
        run: ansible-lint
      - name: Validate the Packer provisioner with shared roles
        env:
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles
        run: ansible-playbook --syntax-check -i localhost, packer/k8s-node/playbook.yml
      - name: Test worker-only bootstrap and token cleanup
        run: python3 -m unittest discover -s tests -p test_worker_bootstrap.py

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: pip install pyyaml
      - run: for script in scripts/*.sh; do bash -n "$script"; done
      - run: python3 -m unittest discover -s tests -v

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: pip install -r docs-requirements.txt
      - run: mkdocs build --strict

  kyverno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test container security policy regressions
        env:
          # Match the appVersion of the pinned Kyverno chart.
          KYVERNO_VERSION: v1.17.1
          KYVERNO_SHA256: d0c0f52e8fc8d66a3663b63942b131e5f91b63f7644b3e446546f79142d1b7a3
        run: |
          cli_dir="$(mktemp -d)"
          trap 'rm -rf "$cli_dir"' EXIT
          archive="kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/${archive}" \
            -o "$cli_dir/$archive"
          printf '%s  %s\n' "$KYVERNO_SHA256" "$cli_dir/$archive" | sha256sum --check -
          tar -xzf "$cli_dir/$archive" -C "$cli_dir" kyverno
          "$cli_dir/kyverno" test tests/kyverno --remove-color
