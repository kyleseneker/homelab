apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: container-security
policies:
  - ../../../k8s/components/kyverno-policies/disallow-latest-tag.yml
  - ../../../k8s/components/kyverno-policies/require-readonly-rootfs.yml
  - ../../../k8s/components/kyverno-policies/require-resource-limits.yml
  - ../../../k8s/components/kyverno-policies/require-run-as-nonroot.yml
  - ../../../k8s/components/kyverno-policies/require-labels.yml
resources:
  - pods.yaml
  - labels.yaml
results:
  - policy: disallow-latest-tag
    resources:
      - valid-no-init
    kind: Pod
    result: pass
  - policy: require-readonly-rootfs
    resources:
      - valid-no-init
    kind: Pod
    result: pass
  - policy: require-resource-limits
    resources:
      - valid-no-init
    kind: Pod
    result: pass
  - policy: require-run-as-nonroot
    resources:
      - valid-no-init
    kind: Pod
    result: pass
  - policy: disallow-latest-tag
    resources:
      - valid-init
    kind: Pod
    result: pass
  - policy: require-readonly-rootfs
    resources:
      - valid-init
    kind: Pod
    result: pass
  - policy: require-resource-limits
    resources:
      - valid-init
    kind: Pod
    result: pass
  - policy: require-run-as-nonroot
    resources:
      - valid-init
    kind: Pod
    result: pass
  - policy: disallow-latest-tag
    resources:
      - init-latest
    kind: Pod
    result: fail
  - policy: require-run-as-nonroot
    resources:
      - init-root
    kind: Pod
    result: fail
  - policy: require-readonly-rootfs
    resources:
      - init-writable
    kind: Pod
    result: fail
  - policy: require-resource-limits
    resources:
      - init-unlimited
    kind: Pod
    result: fail
  - policy: disallow-latest-tag
    resources:
      - ephemeral-latest
    kind: Pod
    result: fail
  - policy: require-run-as-nonroot
    resources:
      - ephemeral-root
    kind: Pod
    result: fail
  - policy: require-readonly-rootfs
    resources:
      - ephemeral-writable
    kind: Pod
    result: fail
  - policy: require-run-as-nonroot
    resources:
      - init-overrides-pod-nonroot
    kind: Pod
    result: fail
  - policy: disallow-latest-tag
    resources:
      - registry-port-without-tag
    kind: Pod
    result: fail
  - policy: disallow-latest-tag
    resources:
      - bare-untagged
    kind: Pod
    result: fail
  - policy: disallow-latest-tag
    resources:
      - tagged-registry-port
    kind: Pod
    result: pass
  - policy: disallow-latest-tag
    resources:
      - immutable-digest
    kind: Pod
    result: pass
  - policy: require-labels
    resources:
      - labeled
    kind: Pod
    result: pass
  - policy: require-labels
    resources:
      - unlabeled
    kind: Pod
    result: fail
  - policy: require-labels
    resources:
      - empty-label
    kind: Pod
    result: fail
