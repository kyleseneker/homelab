apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-host-path
  namespace: policy-test
  labels:
    app.kubernetes.io/name: baseline-test
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: baseline-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: baseline-test
    spec:
      containers:
        - name: main
          image: busybox:1.38
      volumes:
        - name: h0
          hostPath:
            path: /etc
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup
  namespace: backups
spec:
  schedule: 0 2 * * *
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: etcd-backup
        spec:
          containers:
            - name: main
              image: busybox:1.38
          volumes:
            - name: h0
              hostPath:
                path: /etc/kubernetes/pki
          restartPolicy: OnFailure
