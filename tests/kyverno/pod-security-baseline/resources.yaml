apiVersion: v1
kind: Pod
metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus-node-exporter
spec:
  containers:
    - name: main
      image: busybox:1.38
      ports:
        - containerPort: 9100
          hostPort: 9100
  volumes:
    - name: h0
      hostPath:
        path: /
    - name: h1
      hostPath:
        path: /proc
    - name: h2
      hostPath:
        path: /sys
  hostNetwork: true
  hostPID: true
---
apiVersion: v1
kind: Pod
metadata:
  name: node-exporter-host-ipc
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus-node-exporter
spec:
  containers:
    - name: main
      image: busybox:1.38
  hostIPC: true
---
apiVersion: v1
