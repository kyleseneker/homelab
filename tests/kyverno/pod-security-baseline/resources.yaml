---
apiVersion: v1
kind: Pod
metadata:
  name: unsafe-sysctl
  namespace: policy-test
  labels:
    app.kubernetes.io/name: baseline-test
spec:
  containers:
    - name: main
      image: busybox:1.38
  securityContext:
    sysctls:
      - name: net.ipv4.conf.all.src_valid_mark
        value: '1'
---
apiVersion: v1
kind: Pod
metadata:
  name: safe-sysctl
  namespace: policy-test
  labels:
