apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup
  namespace: backups
spec:
  schedule: 0 2 * * *
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: etcd-backup
        spec:
          containers:
            - name: main
              image: busybox:1.38
          volumes:
            - name: h0
              hostPath:
                path: /etc/kubernetes/pki
          restartPolicy: OnFailure
---
apiVersion: v1
kind: Pod
metadata:
  name: velero-node-agent
  namespace: backups
  labels:
    name: node-agent
spec:
  containers:
    - name: main
      image: busybox:1.38
  volumes:
    - name: host-pods
      hostPath:
        path: /var/lib/kubelet/pods
    - name: host-plugins
      hostPath:
        path: /var/lib/kubelet/plugins
---
# A backup hosting pod: the volume path node-agent logged, followed by every
# volume it inherits from the node-agent DaemonSet.
apiVersion: v1
kind: Pod
metadata:
  name: velero-pvb-hosting
  namespace: backups
  labels:
    velero.io/pod-volume-backup: velero-pvb-hosting
spec:
  containers:
    - name: main
      image: busybox:1.38
  volumes:
    - name: client
      hostPath:
        path: /var/lib/kubelet/pods/8e57767c-adcb-4692-a0fc-96d8247ac88c/volumes/kubernetes.io~nfs/pvc-b47ee604-f7cc-4adf-9ff0-c5a9cad1cef2
    - name: cloud-credentials
      secret:
        secretName: velero
    - name: host-pods
      hostPath:
        path: /var/lib/kubelet/pods
    - name: host-plugins
      hostPath:
        path: /var/lib/kubelet/plugins
    - name: scratch
      emptyDir: {}
---
apiVersion: v1
kind: Pod
metadata:
  name: velero-pvr-hosting
  namespace: backups
  labels:
    velero.io/pod-volume-restore: velero-pvr-hosting
spec:
  containers:
    - name: main
      image: busybox:1.38
  volumes:
    - name: client
      hostPath:
        path: /var/lib/kubelet/pods/986c625f-cd46-4280-80fc-5282f616ac85/volumes/kubernetes.io~empty-dir/tmp
    - name: cache
      persistentVolumeClaim:
        claimName: velero-pvr-hosting-cache
    - name: cloud-credentials
      secret:
        secretName: velero
    - name: host-pods
      hostPath:
        path: /var/lib/kubelet/pods
    - name: host-plugins
      hostPath:
        path: /var/lib/kubelet/plugins
    - name: scratch
      emptyDir: {}
---
