apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: pod-security-baseline
policies:
  - ../../../k8s/components/kyverno-policies/disallow-privileged-containers.yml
  - ../../../k8s/components/kyverno-policies/disallow-host-namespaces.yml
  - ../../../k8s/components/kyverno-policies/disallow-host-ports.yml
  - ../../../k8s/components/kyverno-policies/disallow-host-path.yml
  - ../../../k8s/components/kyverno-policies/restrict-capabilities.yml
  - ../../../k8s/components/kyverno-policies/restrict-sysctls.yml
  - ../../../k8s/components/kyverno-policies/restrict-security-profiles.yml
exceptions:
  - ../../../k8s/components/kyverno-policies/baseline-exceptions.yml
resources:
  - resources.yaml
results:
  - policy: disallow-host-namespaces
    resources:
      - host-ipc
      - host-network
      - host-pid
      - node-exporter-elsewhere
      - node-exporter-host-ipc
    kind: Pod
    result: fail
  - policy: disallow-host-namespaces
    resources:
      - compliant
      - node-exporter
    kind: Pod
    result: pass
  - policy: disallow-host-path
    resources:
      - deploy-host-path
    kind: Deployment
    result: fail
  - policy: disallow-host-path
    resources:
      - host-path-etc
      - jellyfin-etc
      - sonarr-dri
    kind: Pod
    result: fail
  - policy: disallow-host-path
    resources:
      - etcd-backup
    kind: CronJob
    result: pass
  - policy: disallow-host-path
    resources:
      - compliant
      - jellyfin-dri
      - node-exporter
    kind: Pod
    result: pass
  - policy: disallow-host-ports
    resources:
      - host-port
    kind: Pod
    result: fail
  - policy: disallow-host-ports
    resources:
      - compliant
      - container-port-only
      - node-exporter
    kind: Pod
    result: pass
  - policy: disallow-privileged-containers
    resources:
      - privileged
      - proc-mount-unmasked
    kind: Pod
    result: fail
  - policy: disallow-privileged-containers
    resources:
      - compliant
    kind: Pod
    result: pass
  - policy: restrict-capabilities
    resources:
      - add-net-admin
      - gluetun-sys-admin
      - init-adds-sys-admin
    kind: Pod
    result: fail
  - policy: restrict-capabilities
    resources:
      - add-net-bind-service
      - compliant
      - gluetun
    kind: Pod
    result: pass
  - policy: restrict-security-profiles
    resources:
      - apparmor-unconfined
      - device-plugin-selinux-elsewhere
      - pod-seccomp-unconfined
      - seccomp-unconfined
      - selinux-spc
    kind: Pod
    result: fail
  - policy: restrict-security-profiles
    resources:
      - compliant
      - gpu-plugin-selinux
      - selinux-container
    kind: Pod
    result: pass
  - policy: restrict-sysctls
    resources:
      - unsafe-sysctl
    kind: Pod
    result: fail
  - policy: restrict-sysctls
    resources:
      - compliant
      - gluetun
      - safe-sysctl
    kind: Pod
    result: pass
