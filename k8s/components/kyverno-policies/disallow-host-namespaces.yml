apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-host-namespaces
  annotations:
    policies.kyverno.io/title: Disallow Host Namespaces
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Sharing the host's network, PID or IPC namespace exposes the node to
      the pod. A PolicyException can allow hostNetwork, hostPID or hostIPC
      by name in allowedValues.
spec:
  validationActions:
    - Deny
  # Fail closed, like the legacy policies' webhooks.
  failurePolicy: Fail
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers:
        - daemonsets
        - deployments
        - jobs
        - cronjobs
        - replicasets
        - replicationcontrollers
        - statefulsets
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
    # kube-system holds the control plane and Cilium; every other workload that
    # needs host access has a PolicyException in baseline-exceptions.yml.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
  matchConditions:
    - name: skip-cilium-connectivity-tests
      expression: namespaceObject == null || !namespaceObject.metadata.name.startsWith('cilium-test-')
  validations:
    - expression: >-
        !object.spec.?hostNetwork.orValue(false) || 'hostNetwork' in exceptions.allowedValues
      message: hostNetwork is not allowed.
    - expression: >-
        !object.spec.?hostPID.orValue(false) || 'hostPID' in exceptions.allowedValues
      message: hostPID is not allowed.
    - expression: >-
        !object.spec.?hostIPC.orValue(false) || 'hostIPC' in exceptions.allowedValues
      message: hostIPC is not allowed.
