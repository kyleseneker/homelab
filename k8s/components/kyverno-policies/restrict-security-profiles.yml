apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-security-profiles
  annotations:
    policies.kyverno.io/title: Restrict Seccomp, AppArmor and SELinux
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Pods and containers must not disable seccomp or AppArmor, and may use
      only the container SELinux types without a custom user or role. A
      PolicyException can allow further SELinux types in allowedValues.
spec:
  validationActions:
    - Deny
  # Fail closed, like the legacy policies' webhooks.
  failurePolicy: Fail
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers:
        - daemonsets
        - deployments
        - jobs
        - cronjobs
        - replicasets
        - replicationcontrollers
        - statefulsets
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
    # kube-system holds the control plane and Cilium; every other workload that
    # needs host access has a PolicyException in baseline-exceptions.yml.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
  matchConditions:
    - name: skip-cilium-connectivity-tests
      expression: namespaceObject == null || !namespaceObject.metadata.name.startsWith('cilium-test-')
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
    - name: contexts
      expression: >-
        [object.spec.?securityContext.orValue({})] +
        variables.allContainers.map(c, c.?securityContext.orValue({}))
    - name: selinuxTypes
      expression: >-
        ['', 'container_t', 'container_init_t', 'container_kvm_t', 'container_engine_t']
  validations:
    - expression: >-
        variables.contexts.all(sc, sc.?seccompProfile.?type.orValue('') != 'Unconfined')
      message: Seccomp must not be Unconfined.
    - expression: >-
        variables.contexts.all(sc, sc.?appArmorProfile.?type.orValue('') != 'Unconfined')
      message: AppArmor must not be Unconfined.
    - expression: >-
        variables.contexts.all(sc,
          (sc.?seLinuxOptions.?type.orValue('') in variables.selinuxTypes ||
           sc.?seLinuxOptions.?type.orValue('') in exceptions.allowedValues) &&
          sc.?seLinuxOptions.?user.orValue('') == '' &&
          sc.?seLinuxOptions.?role.orValue('') == '')
      message: SELinux options must use a container type and no custom user or role.
