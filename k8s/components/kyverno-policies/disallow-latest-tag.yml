apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Container images must not use the ':latest' tag or omit a tag entirely.
      Images should use a specific tag or SHA-256 digest for reproducibility. A registry port does not count as an image tag.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: validate-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - argocd
                - cilium-test-*
      validate:
        message: "Container images must specify a non-latest tag or a SHA-256 digest."
        foreach:
          - list: "request.object.spec.[containers, initContainers, ephemeralContainers][]"
            deny:
              conditions:
                any:
                  - key: "{{ regex_match('^([^@]+@sha256:[a-fA-F0-9]{64}|[^@]+:[^/:@]+)$', element.image) }}"
                    operator: Equals
                    value: false
                  - key: "{{ ends_with(element.image, ':latest') }}"
                    operator: Equals
                    value: true
