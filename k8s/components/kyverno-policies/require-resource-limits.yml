apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require Resource Limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      All containers must specify memory and CPU resource limits to prevent
      unbounded resource consumption on the cluster.
spec:
  validationActions:
    - Deny
  # Fail closed, like the legacy policies' webhooks.
  failurePolicy: Fail
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers:
        - daemonsets
        - deployments
        - jobs
        - cronjobs
        - replicasets
        - replicationcontrollers
        - statefulsets
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kyverno
            - argocd
            - backups
            - local-path-storage
  matchConditions:
    - name: skip-cilium-connectivity-tests
      expression: namespaceObject == null || !namespaceObject.metadata.name.startsWith('cilium-test-')
  variables:
    # Ephemeral containers cannot declare resources, matching the legacy rule.
    - name: limitedContainers
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
  validations:
    - expression: >-
        variables.limitedContainers.all(c,
          'memory' in c.?resources.?limits.orValue({}) &&
          'cpu' in c.?resources.?limits.orValue({}))
      message: All containers must have memory and CPU limits defined.
