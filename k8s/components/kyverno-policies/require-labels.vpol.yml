apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-labels
  annotations:
    policies.kyverno.io/title: Require Labels
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: low
    policies.kyverno.io/description: >-
      Pods must have the 'app.kubernetes.io/name' label for consistent
      identification across monitoring, networking, and service discovery.
spec:
  # Audit beside the legacy ClusterPolicy until their reports agree.
  validationActions:
    - Audit
  failurePolicy: Ignore
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers:
        - daemonsets
        - deployments
        - jobs
        - cronjobs
        - replicasets
        - replicationcontrollers
        - statefulsets
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kyverno
            - argocd
            - backups
            - intel-gpu-operator
            - nfs-provisioner
  matchConditions:
    - name: skip-cilium-connectivity-tests
      expression: namespaceObject == null || !namespaceObject.metadata.name.startsWith('cilium-test-')
  validations:
    - expression: object.metadata.?labels[?'app.kubernetes.io/name'].orValue('') != ''
      message: The label 'app.kubernetes.io/name' is required.
