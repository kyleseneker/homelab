apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-run-as-nonroot
  annotations:
    policies.kyverno.io/title: Require Run As Non-Root
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Containers must run as non-root. Either the pod-level securityContext
      must set runAsNonRoot: true, or each container must set it individually.
spec:
  # Audit beside the legacy ClusterPolicy until their reports agree.
  validationActions:
    - Audit
  failurePolicy: Ignore
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers:
        - daemonsets
        - deployments
        - jobs
        - cronjobs
        - replicasets
        - replicationcontrollers
        - statefulsets
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kyverno
            - argocd
            - arr
            - auth
            - backups
            - intel-gpu-operator
            - monitoring
            - nfs-provisioner
            - local-path-storage
  matchConditions:
    - name: skip-cilium-connectivity-tests
      expression: namespaceObject == null || !namespaceObject.metadata.name.startsWith('cilium-test-')
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
    - name: podRunsAsNonRoot
      expression: object.spec.?securityContext.?runAsNonRoot.orValue(false) == true
  validations:
    # A container's own setting wins; an unset container inherits the pod's.
    - expression: >-
        variables.allContainers.all(c,
          c.?securityContext.?runAsNonRoot.hasValue()
            ? c.securityContext.runAsNonRoot == true
            : variables.podRunsAsNonRoot)
      message: Containers must set securityContext.runAsNonRoot to true.
