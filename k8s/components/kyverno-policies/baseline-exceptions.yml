# Pod Security baseline exceptions. Exceptions are honored only in the kyverno
# namespace, and each allows exactly the values its workload needs; the policy
# still rejects anything else.
# Intel QSV hardware transcoding reads the render node.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: baseline-arr-jellyfin
  namespace: kyverno
spec:
  policyRefs:
    - name: disallow-host-path
      kind: ValidatingPolicy
  allowedValues:
    - '/dev/dri'
  matchConditions:
    - name: arr-jellyfin
      expression: >-
        object.metadata.namespace == 'arr' &&
        (object.kind == 'Pod' ? object.metadata.?labels.orValue({}) :
           object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.metadata.?labels.orValue({}) :
           object.spec.template.metadata.?labels.orValue({}))[?'app.kubernetes.io/name'].orValue('') == 'arr-jellyfin'
---
