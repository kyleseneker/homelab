# Reports node metrics from the host's namespaces and filesystems.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: baseline-node-exporter
  namespace: kyverno
spec:
  policyRefs:
    - name: disallow-host-namespaces
      kind: ValidatingPolicy
    - name: disallow-host-ports
      kind: ValidatingPolicy
    - name: disallow-host-path
      kind: ValidatingPolicy
  allowedValues:
    - 'hostNetwork'
    - 'hostPID'
    - '9100'
    - '/'
    - '/proc'
    - '/sys'
  matchConditions:
    - name: node-exporter
      expression: >-
        object.metadata.namespace == 'monitoring' &&
        (object.kind == 'Pod' ? object.metadata.?labels.orValue({}) :
           object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.metadata.?labels.orValue({}) :
           object.spec.template.metadata.?labels.orValue({}))[?'app.kubernetes.io/name'].orValue('') == 'prometheus-node-exporter'
---
# The provisioner's helper pods create and delete volume directories on the node.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: baseline-local-path-helper
  namespace: kyverno
spec:
  policyRefs:
    - name: disallow-host-path
      kind: ValidatingPolicy
  allowedValues:
    - '/opt/local-path-provisioner'
    - '/opt/local-path-provisioner/'
  matchConditions:
    - name: local-path-helper
      expression: >-
        object.metadata.namespace == 'local-path-storage' &&
        (object.kind == 'Pod' ? object.metadata.?labels.orValue({}) :
           object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.metadata.?labels.orValue({}) :
           object.spec.template.metadata.?labels.orValue({}))[?'app.kubernetes.io/name'].orValue('') == 'local-path-provisioner-helper'
