# Gluetun manages the pod's VPN tunnel, routes and firewall.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: baseline-arr-vpn-downloads
  namespace: kyverno
spec:
  policyRefs:
    - name: restrict-capabilities
      kind: ValidatingPolicy
    - name: restrict-sysctls
      kind: ValidatingPolicy
  allowedValues:
    - 'NET_ADMIN'
    - 'net.ipv4.conf.all.src_valid_mark'
  matchConditions:
    - name: arr-vpn-downloads
      expression: >-
        object.metadata.namespace == 'arr' &&
        (object.kind == 'Pod' ? object.metadata.?labels.orValue({}) :
           object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.metadata.?labels.orValue({}) :
           object.spec.template.metadata.?labels.orValue({}))[?'app.kubernetes.io/name'].orValue('') == 'arr-vpn-downloads'
---
# File system backups read and restore pod volumes through the kubelet's directories.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: baseline-velero-node-agent
  namespace: kyverno
spec:
  policyRefs:
    - name: disallow-host-path
      kind: ValidatingPolicy
  allowedValues:
    - '/var/lib/kubelet/pods'
    - '/var/lib/kubelet/plugins'
  matchConditions:
    - name: velero-node-agent
      expression: >-
        object.metadata.namespace == 'backups' &&
        (object.kind == 'Pod' ? object.metadata.?labels.orValue({}) :
           object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.metadata.?labels.orValue({}) :
           object.spec.template.metadata.?labels.orValue({}))[?'name'].orValue('') == 'node-agent'
---
# Since Velero 1.17, node-agent backs up and restores each pod volume through a
# hosting pod. The pod is named after its PodVolumeBackup or PodVolumeRestore
# and carries that name in a label. It mounts that volume's directory under the
# kubelet's pods directory, a path that differs for every volume and is allowed
# by prefix, and it inherits all of node-agent's volumes, including both
# kubelet directories above.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: baseline-velero-pod-volume-exposer
  namespace: kyverno
spec:
  policyRefs:
    - name: disallow-host-path
      kind: ValidatingPolicy
  allowedValues:
    - '/var/lib/kubelet/pods'
    - '/var/lib/kubelet/plugins'
    - 'prefix:/var/lib/kubelet/pods/'
  matchConditions:
    - name: velero-pod-volume-exposer
      expression: >-
        object.metadata.namespace == 'backups' && object.kind == 'Pod' &&
        object.metadata.?name.orValue('') != '' &&
        (object.metadata.?labels.orValue({})[?'velero.io/pod-volume-backup'].orValue('') == object.metadata.name ||
         object.metadata.?labels.orValue({})[?'velero.io/pod-volume-restore'].orValue('') == object.metadata.name)
---
# Snapshots etcd and records the control-plane configuration needed to rebuild it.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: baseline-etcd-backup
  namespace: kyverno
spec:
  policyRefs:
    - name: disallow-host-path
      kind: ValidatingPolicy
  allowedValues:
    - '/etc/containerd/config.toml'
    - '/etc/default/kubelet'
    - '/etc/hostname'
    - '/etc/kubernetes'
    - '/etc/kubernetes/pki'
    - '/etc/os-release'
    - '/var/lib/kubelet/config.yaml'
    - '/var/lib/kubelet/kubeadm-flags.env'
  matchConditions:
    - name: etcd-backup
      expression: >-
        object.metadata.namespace == 'backups' &&
        (object.kind == 'Pod' ? object.metadata.?labels.orValue({}) :
           object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.metadata.?labels.orValue({}) :
           object.spec.template.metadata.?labels.orValue({}))[?'app.kubernetes.io/name'].orValue('') == 'etcd-backup'
---
# Registers the GPU with the kubelet and exposes its device nodes, under the
# SELinux type the upstream plugin ships with.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: baseline-intel-gpu-plugin
  namespace: kyverno
spec:
  policyRefs:
    - name: disallow-host-path
      kind: ValidatingPolicy
    - name: restrict-security-profiles
      kind: ValidatingPolicy
  allowedValues:
    - '/dev/dri'
    - '/sys/class/drm'
    - '/var/lib/kubelet/device-plugins'
    - '/var/run/cdi'
    - 'container_device_plugin_t'
  matchConditions:
    - name: intel-gpu-plugin
      expression: >-
        object.metadata.namespace == 'intel-gpu-operator' &&
        (object.kind == 'Pod' ? object.metadata.?labels.orValue({}) :
           object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.metadata.?labels.orValue({}) :
           object.spec.template.metadata.?labels.orValue({}))[?'app'].orValue('') == 'intel-gpu-plugin'
---
