apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../applicationsets
  - project.yml
patches:
  - target:
      kind: ApplicationSet
      name: cluster-apps
    patch: |
      - op: replace
        path: /spec/generators/0/git/files/0/path
        value: k8s/clusters/homelabrestore01/**/config.yml
      - op: replace
        path: /spec/template/spec/project
        value: restore-lab
