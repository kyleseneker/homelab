apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: media
data:
  settings.yaml: |
    title: Homelab
    favicon: https://jellyfin.home.seneker.io/web/favicon.ico
    theme: dark
    color: slate
    headerStyle: clean
    layout:
      Apps:
        style: row
        columns: 3
      Media:
        style: row
        columns: 5
      Observability:
        style: row
        columns: 6
      Infrastructure:
        style: row
        columns: 5

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: homelabk8s01
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - search:
        provider: google
        target: _blank
    - datetime:
        text_size: xl
        format:
          dateStyle: short
          timeStyle: short
          hourCycle: h12

  bookmarks.yaml: |
    - Resources:
        - Documentation:
            - icon: si-mkdocs
              href: https://kyleseneker.github.io/homelab/
              description: Homelab docs
        - GitHub:
            - icon: si-github
              href: https://github.com/kyleseneker/homelab
              description: Source repo

  services.yaml: |
    - Apps:
        - Jellyfin:
            icon: jellyfin.svg
            href: https://jellyfin.home.seneker.io
            description: Media server
            widget:
              type: jellyfin
              url: http://jellyfin.media.svc.cluster.local:8096
              key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
              enableBlocks: true
              enableNowPlaying: true
              fields: ["movies", "series", "episodes"]
        - Seerr:
            icon: seerr.svg
            href: https://seerr.home.seneker.io
            description: Media requests
            widget:
              type: seerr
              url: http://seerr.media.svc.cluster.local:80
              key: "{{HOMEPAGE_VAR_SEERR_KEY}}"
        - Home Assistant:
            icon: home-assistant.svg
            href: https://ha.home.seneker.io
            description: Home automation
    - Media:
        - qBittorrent:
            icon: qbittorrent.svg
            href: https://qbit.home.seneker.io
            description: Torrent client
            widget:
              type: qbittorrent
              url: http://downloads.media.svc.cluster.local:8080
              username: admin
              password: "{{HOMEPAGE_VAR_QBIT_PASSWORD}}"
        - Sonarr:
            icon: sonarr.svg
            href: https://sonarr.home.seneker.io
            description: TV shows
            widget:
              type: sonarr
              url: http://sonarr.media.svc.cluster.local:8989
              key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
        - Radarr:
            icon: radarr.svg
            href: https://radarr.home.seneker.io
            description: Movies
            widget:
              type: radarr
              url: http://radarr.media.svc.cluster.local:7878
              key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
        - Prowlarr:
            icon: prowlarr.svg
            href: https://prowlarr.home.seneker.io
            description: Indexer manager
            widget:
              type: prowlarr
              url: http://prowlarr.media.svc.cluster.local:9696
              key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"
        - Bazarr:
            icon: bazarr.svg
            href: https://bazarr.home.seneker.io
            description: Subtitles
            widget:
              type: bazarr
              url: http://bazarr.media.svc.cluster.local:6767
              key: "{{HOMEPAGE_VAR_BAZARR_KEY}}"
        - Tdarr:
            icon: tdarr.png
            href: https://tdarr.home.seneker.io
            description: Transcoding
            widget:
              type: tdarr
              url: http://tdarr.media.svc.cluster.local:8265
    - Observability:
        - Grafana:
            icon: grafana.svg
            href: https://grafana.home.seneker.io
            description: Dashboards
        - Prometheus:
            icon: prometheus.svg
            href: https://prometheus.home.seneker.io
            description: Metrics
        - Alertmanager:
            icon: alertmanager.svg
            href: https://alertmanager.home.seneker.io
            description: Alert routing
        - Loki:
            icon: loki.svg
            href: https://grafana.home.seneker.io/explore
            description: Logs (via Grafana)
        - Uptime Kuma:
            icon: uptime-kuma.svg
            href: https://status.home.seneker.io
            description: Status monitoring
            widget:
              type: uptimekuma
              url: http://uptime-kuma.monitoring.svc.cluster.local:3001
              slug: default
        - Goldilocks:
            icon: goldilocks.svg
            href: https://goldilocks.home.seneker.io
            description: Resource recommendations
    - Infrastructure:
        - ArgoCD:
            icon: argo-cd.svg
            href: https://argocd.home.seneker.io
            description: GitOps
        - Proxmox:
            icon: proxmox.svg
            href: https://proxmox.home.seneker.io:8006
            description: Hypervisor
        - Vault:
            icon: vault.svg
            href: https://vault.home.seneker.io
            description: Secrets management
        - Authentik:
            icon: authentik.png
            href: https://auth.home.seneker.io
            description: SSO / Identity
        - Homepage:
            icon: homepage.png
            href: https://home.seneker.io
            description: Dashboard
