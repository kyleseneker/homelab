# sb-harvester — homelab-resident rich live-stats harvester (cbb-hub).
#
# Polls Supabase for in-progress D1 baseball games, renders the StatBroadcast
# rich monitor with Playwright Chromium (egress is this cluster's residential
# WAN, so Cloudflare lets it through), parses, and writes live_game_state back.
# OUTBOUND ONLY — no Service, no Route, nothing exposed.
#
# Every-minute CronJob with concurrencyPolicy Forbid = self-throttling ~60s
# poll. Image carries Deno + Playwright's bundled Chromium.
defaultPodOptions:
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    runAsNonRoot: true
controllers:
  main:
    type: cronjob
    cronjob:
      schedule: "* * * * *"
      concurrencyPolicy: Forbid
      successfulJobsHistory: 1
      failedJobsHistory: 3
      backoffLimit: 1
    containers:
      main:
        image:
          # Built + pushed by cbb-hub .github/workflows/build-sb-harvester.yml.
          # Moving :main tag + Always pull until Renovate pins a digest.
          repository: ghcr.io/kyleseneker/cbb-sb-harvester
          tag: main
          pullPolicy: Always
        env:
          TZ: America/New_York
        envFrom:
          - secretRef:
              name: sb-harvester-secrets
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1000m"
            memory: 1Gi
        probes:
          liveness:
            enabled: false
          readiness:
            enabled: false
          startup:
            enabled: false
# emptyDir mounts make the read-only rootfs writable where Chromium needs it.
# The harvester launches Chromium with --disable-dev-shm-usage, so /tmp absorbs
# shared memory and no tmpfs /dev/shm is required.
persistence:
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
  home:
    type: emptyDir
    globalMounts:
      - path: /home/pwuser
