apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: arrchitect
  namespace: arrchitect
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: "Prometheus in; the API server and the media apps out"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: arrchitect
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
      toPorts:
        - ports:
            - port: "5055"
              protocol: TCP
            - port: "6767"
              protocol: TCP
            - port: "7878"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            - port: "8096"
              protocol: TCP
            - port: "8265"
              protocol: TCP
            - port: "8989"
              protocol: TCP
            - port: "9696"
              protocol: TCP
