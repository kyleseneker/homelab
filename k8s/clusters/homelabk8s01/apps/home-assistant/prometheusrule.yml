apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: home-assistant
  namespace: home-automation
  labels:
    app.kubernetes.io/name: home-assistant
spec:
  groups:
    - name: home-assistant
      rules:
        - alert: HomeAssistantMetricsUnavailable
          expr: |
            up{namespace="home-automation", job="home-assistant"} == 0
            or
            absent(up{namespace="home-automation", job="home-assistant"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Home Assistant metrics are unavailable
            description: >-
              Prometheus has not scraped /api/prometheus for 15 minutes. A rejected token
              counts as a failed login, so five failed scrapes ban the Prometheus pod's
              address. Check the home-assistant-prometheus Secret and /config/ip_bans.yaml.
        # The backup sensors are exported only once they hold a time. "Attempted" is
        # set when an automatic backup starts and "successful" when it completes.
        - alert: HomeAssistantBackupFailing
          expr: |
            (time() - homeassistant_sensor_timestamp_seconds{entity="sensor.backup_last_successful_automatic_backup"} > 129600)
            or
            (
              max(homeassistant_sensor_timestamp_seconds{entity="sensor.backup_last_attempted_automatic_backup"})
              > on() (max(homeassistant_sensor_timestamp_seconds{entity="sensor.backup_last_successful_automatic_backup"}) or on() vector(0))
            )
            or
            (time() - homeassistant_sensor_timestamp_seconds{entity="sensor.backup_next_scheduled_automatic_backup"} > 3600)
            or
            (
              absent(homeassistant_sensor_timestamp_seconds{entity="sensor.backup_next_scheduled_automatic_backup"})
              and on() up{namespace="home-automation", job="home-assistant"} == 1
            )
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: Home Assistant backups are failing
            description: >-
              The last automatic backup failed, the newest successful one is over 36 hours
              old, a scheduled one is overdue, or automatic backups are off. Native backups
              are the only copy of the config volume, which is on local-path and excluded
              from Velero.
