defaultPodOptions:
  # Home Assistant needs no Kubernetes API access.
  automountServiceAccountToken: false
  annotations:
    # Restart when configuration.yaml changes; Home Assistant reads it at start.
    reloader.stakater.com/auto: 'true'
    # The local-path config volume never leaves the node outside Home
    # Assistant's own encrypted backups, which Velero copies from the NFS volume.
    backup.velero.io/backup-volumes-excludes: config,configuration,venv,tmp
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  # Only these workers can carry the IoT VLAN attachment, and the local-path
  # volume is created on the first one the pod lands on.
  nodeSelector:
    home.seneker.io/iot-vlan: "true"
controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/home-operations/home-assistant
          tag: 2026.10.4@sha256:81271a8bbe2a6019659e9d5cde98b884dd0d67fad6819bb4ab177dceb0c1c5e1
        env:
          TZ: America/Chicago
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        probes:
          liveness:
            enabled: true
            type: TCP
          readiness:
            enabled: true
            type: TCP
          startup:
            enabled: true
            type: TCP
            spec:
              failureThreshold: 60
              periodSeconds: 5
service:
  main:
    controller: main
    ports:
      http:
        port: 8123
persistence:
  config:
    type: persistentVolumeClaim
    existingClaim: home-assistant-config
    globalMounts:
      - path: /config
  configuration:
    type: configMap
    name: home-assistant-configuration
    globalMounts:
      - path: /config/configuration.yaml
        subPath: configuration.yaml
        readOnly: true
  backups:
    type: persistentVolumeClaim
    existingClaim: home-assistant-backups
    globalMounts:
      - path: /config/backups
  # The image rebuilds this virtualenv whenever the image changes; it stays
  # out of the config volume and its backups.
  venv:
    type: emptyDir
    globalMounts:
      - path: /config/.venv
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
