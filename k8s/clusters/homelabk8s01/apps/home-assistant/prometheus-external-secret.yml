# The scrape user's long-lived token (ADR-029). It can control entities, so it
# syncs only into this namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-prometheus
  namespace: home-automation
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: home-assistant-prometheus
  data:
    - secretKey: token
      remoteRef:
        key: apps/home-assistant
        property: prometheus-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
