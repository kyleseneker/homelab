# Managed in Git (ADR-029) and mounted read-only over /config/configuration.yaml.
# Automations, scripts and scenes made in the UI stay in their own files on the
# config volume.
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-configuration
  namespace: home-automation
data:
  configuration.yaml: |
    # Loads default set of integrations. Do not remove.
    default_config:

    # Load frontend themes from the themes folder
    frontend:
      themes: !include_dir_merge_named themes

    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml

    # Discovery and notifications hand out this URL, never the IoT VLAN address.
    # The http integration's settings (trusted proxies, IP bans) are UI-managed
    # since 2026.10 and recorded in docs/apps/home-assistant.md.
    homeassistant:
      external_url: https://ha.home.seneker.io
      internal_url: https://ha.home.seneker.io
