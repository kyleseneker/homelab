apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant-backup-holder
  namespace: home-automation
  labels:
    app.kubernetes.io/name: home-assistant-backup-holder
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant-backup-holder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant-backup-holder
        app.kubernetes.io/component: backup-volume
    spec:
      automountServiceAccountToken: false
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: home-assistant
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: holder
          image: registry.k8s.io/pause:3.10
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: backups
              mountPath: /backups
              readOnly: true
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: home-assistant-backups
