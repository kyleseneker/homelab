apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: exportarr-secrets
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: exportarr-secrets
  data:
    - secretKey: sonarr-api-key
      remoteRef:
        key: apps/media
        property: sonarr-api-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: radarr-api-key
      remoteRef:
        key: apps/media
        property: radarr-api-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: prowlarr-api-key
      remoteRef:
        key: apps/media
        property: prowlarr-api-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: bazarr-api-key
      remoteRef:
        key: apps/media
        property: bazarr-api-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
