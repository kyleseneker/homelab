apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarr-env
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: sonarr-env
  data:
    - secretKey: SONARR__AUTH__APIKEY
      remoteRef:
        key: apps/media
        property: sonarr-api-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
