apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent-credentials
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: qbittorrent-credentials
    template:
      engineVersion: v2
      data:
        username: admin
        password: "{{ .password }}"
        password-pbkdf2: '{{ index . "password-pbkdf2" }}'
  data:
    - secretKey: password
      remoteRef:
        key: apps/unpackerr
        property: UN_QBIT_0_PASSWORD
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: password-pbkdf2
      remoteRef:
        key: apps/qbittorrent
        property: webui-password-pbkdf2
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
