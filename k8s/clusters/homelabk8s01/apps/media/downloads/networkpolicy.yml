apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: downloads
  namespace: media
spec:
  description: "Authentik's outpost in; Gluetun's VPN tunnel out"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: downloads
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: auth
            app.kubernetes.io/name: authentik
            app.kubernetes.io/component: server
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEntities:
        - world
