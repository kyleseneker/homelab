global:
  templateEvaluation:
    excludePaths:
      - [controllers, main, initContainers, gluetun, env, VPN_PORT_FORWARDING_UP_COMMAND]
      - [controllers, main, initContainers, gluetun, env, VPN_PORT_FORWARDING_DOWN_COMMAND]
controllers:
  main:
    initContainers:
      # PIA rotates server IPs; the image's built-in list goes stale and Gluetun can only refresh it through a working tunnel.
      gluetun-servers:
        image:
          repository: qmcgaw/gluetun
          tag: v3.41.3
        command:
          - /bin/sh
          - -c
          - /gluetun-entrypoint update -enduser -providers "private internet access" || echo "PIA server update failed; using the stored list"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
      # Native sidecar: startup healthcheck gates the torrent client.
      gluetun:
        dependsOn:
          - gluetun-servers
        restartPolicy: Always
        image:
          repository: qmcgaw/gluetun
          tag: v3.41.3
        env:
          VPN_SERVICE_PROVIDER: private internet access
          SERVER_REGIONS: CA Montreal
          UPDATER_PERIOD: 24h
          VPN_PORT_FORWARDING: 'on'
          # Rebinding the listening port leaves qBittorrent's DHT without nodes until DHT restarts.
          VPN_PORT_FORWARDING_UP_COMMAND: >-
            /bin/sh -c 'wget -O- -nv --retry-connrefused --post-data
            "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}"
            http://127.0.0.1:8080/api/v2/app/setPreferences
            && wget -O- -nv --post-data "json={\"dht\":false}" http://127.0.0.1:8080/api/v2/app/setPreferences
            && sleep 1
            && wget -O- -nv --post-data "json={\"dht\":true}" http://127.0.0.1:8080/api/v2/app/setPreferences'
          VPN_PORT_FORWARDING_DOWN_COMMAND: '/bin/sh -c ''wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:8080/api/v2/app/setPreferences'''
          FIREWALL_INPUT_PORTS: '8080'
          DOT: 'off'
        envFrom:
          - secretRef:
              name: vpn-credentials
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /gluetun-entrypoint
                  - healthcheck
              initialDelaySeconds: 60
              periodSeconds: 60
              timeoutSeconds: 5
              failureThreshold: 3
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /gluetun-entrypoint
                  - healthcheck
              failureThreshold: 60
              periodSeconds: 5
      seed-webui-password:
        image:
          repository: busybox
          tag: '1.38.0'
        command:
          - sh
          - -c
          - |
            CONF=/config/qBittorrent/qBittorrent.conf
            [ -e "$CONF" ] && exit 0
            mkdir -p "$(dirname "$CONF")"
            printf '[Preferences]\nWebUI\\Username=admin\nWebUI\\Password_PBKDF2="%s"\n' "$PBKDF2" > "$CONF"
        env:
          - name: PBKDF2
            valueFrom:
              secretKeyRef:
                name: qbittorrent-credentials
                key: password-pbkdf2
        securityContext:
          runAsUser: 977
          runAsGroup: 988
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
    containers:
      qbittorrent:
        image:
          repository: lscr.io/linuxserver/qbittorrent
          tag: 5.3.1
        envFrom:
          - configMapRef:
              name: media-env
        env:
          WEBUI_PORT: '8080'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - SETUID
              - SETGID
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
service:
  main:
    controller: main
    ports:
      qbit-http:
        port: 8080
route:
  main:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: homelab-gateway
        namespace: default
        sectionName: https-home
    hostnames:
      - qbit.home.seneker.io
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - name: ak-outpost-authentik-embedded-outpost
            namespace: auth
            port: 9000
persistence:
  gluetun-config:
    type: persistentVolumeClaim
    storageClass: nfs-client
    accessMode: ReadWriteOnce
    size: 256Mi
    globalMounts:
      - path: /gluetun
  qbit-config:
    type: persistentVolumeClaim
    storageClass: nfs-client
    accessMode: ReadWriteOnce
    size: 1Gi
    advancedMounts:
      main:
        seed-webui-password:
          - path: /config
        qbittorrent:
          - path: /config
  data:
    type: persistentVolumeClaim
    existingClaim: media-data
    globalMounts:
      - path: /data
defaultPodOptions:
  annotations:
    reloader.stakater.com/auto: 'true'
    backup.velero.io/backup-volumes-excludes: data
  securityContext:
    sysctls:
      - name: net.ipv4.conf.all.src_valid_mark
        value: '1'
