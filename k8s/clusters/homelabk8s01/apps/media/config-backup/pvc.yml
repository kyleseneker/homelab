apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config-backups
  namespace: media
  labels:
    app.kubernetes.io/name: config-backup
    app.kubernetes.io/component: backup-volume
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-client
  resources:
    requests:
      storage: 2Gi
