apiKey:
  existingSecret: recyclarr-secrets
configs:
  existingConfigMap: recyclarr-config
settings:
  content: |
    server:
      schedule:
        cron: 0 */6 * * *
      logging:
        files: false
envFrom:
  - configMapRef:
      name: media-env
extraVolumes:
  - name: secrets
    secret:
      secretName: recyclarr-secrets
extraVolumeMounts:
  - name: secrets
    mountPath: /config/secrets.yml
    subPath: secrets.yml
    readOnly: true
persistence:
  state:
    storageClass: nfs-client
    size: 256Mi
serviceMonitor:
  enabled: true
deploymentAnnotations:
  reloader.stakater.com/auto: "true"
podAnnotations:
  backup.velero.io/backup-volumes-excludes: data,tmp
# Match the NAS media identity that owns NFS-provisioned directories.
podSecurityContext:
  runAsUser: 977
  runAsGroup: 988
  fsGroup: 988
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi
