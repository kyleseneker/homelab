apiVersion: arrchitect.dev/v1alpha1
kind: Bazarr
metadata:
  name: bazarr
  namespace: media
spec:
  connection:
    url: http://bazarr.media.svc.cluster.local:6767
    apiKeySecretRef:
      name: media-api-keys
      key: bazarr-api-key
  reconcile:
    intervalSeconds: 900
    deletionPolicy: orphan
  general:
    useSonarr: true
    useRadarr: true
    useScenename: true
    minimumScore: 90
    minimumScoreMovie: 70
    adaptiveSearching: true
    multithreading: true
    seriesDefaultProfile: English
    movieDefaultProfile: English
  languages:
    enabled:
      - en
    profiles:
      - profileId: 1
        name: English
        items:
          - language: en
            hi: false
            forced: false
  providers:
    - name: opensubtitlescom
      enabled: true
      settings:
        - name: use_hash
          value: "true"
        - name: include_ai_translated
          value: "false"
        - name: include_machine_translated
          value: "false"
        - name: username
          valueFrom:
            secretKeyRef:
              name: opensubtitles-credentials
              key: username
        - name: password
          valueFrom:
            secretKeyRef:
              name: opensubtitles-credentials
              key: password
  sonarrConnection:
    appRef:
      kind: Sonarr
      name: sonarr
    onlyMonitored: false
  radarrConnection:
    appRef:
      kind: Radarr
      name: radarr
    onlyMonitored: false
  jellyfin:
    appRef:
      kind: Jellyfin
      name: jellyfin
    movieLibraries:
      - Movies
    seriesLibraries:
      - TV Shows
