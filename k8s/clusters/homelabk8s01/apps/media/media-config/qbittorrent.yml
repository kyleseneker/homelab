apiVersion: arrchitect.dev/v1alpha1
kind: QBittorrent
metadata:
  name: qbittorrent
  namespace: media
spec:
  connection:
    url: http://downloads.media.svc.cluster.local:8080
    usernameSecretRef:
      name: qbittorrent-credentials
      key: username
    passwordSecretRef:
      name: qbittorrent-credentials
      key: password
  reconcile:
    intervalSeconds: 300
    deletionPolicy: orphan
  preferences:
    savePath: /data/torrents
    tempPathEnabled: true
    tempPath: /data/torrents/incomplete
    upnp: false
    maxRatioEnabled: true
    maxRatio: '1.0'
    maxRatioAction: stop
    maxSeedingTimeEnabled: true
    maxSeedingTime: 1440
    # All callers, including pods, authenticate with qbittorrent-credentials.
    bypassAuthSubnetWhitelistEnabled: false
    # Gluetun's port-forward command sets listenPort from localhost.
    bypassLocalAuth: true
  categories:
    - name: tv
    - name: movies
