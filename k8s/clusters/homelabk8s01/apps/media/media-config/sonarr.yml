apiVersion: arrchitect.dev/v1alpha1
kind: Sonarr
metadata:
  name: sonarr
  namespace: media
spec:
  connection:
    url: http://sonarr.media.svc.cluster.local:8989
    apiKeySecretRef:
      name: media-api-keys
      key: sonarr-api-key
  reconcile:
    intervalSeconds: 300
    deletionPolicy: orphan
  rootFolders:
    - path: /data/media/tv
  downloadClientConfig:
    enableCompletedDownloadHandling: true
    autoRedownloadFailed: true
  notifications:
    - name: Jellyfin
      appRef:
        kind: Jellyfin
        name: jellyfin
      onDownload: true
      onUpgrade: true
      onRename: true
      fields:
        - name: updateLibrary
          value: true
        - name: notify
          value: false
  mediaManagement:
    downloadPropersAndRepacks: doNotPrefer
    deleteEmptyFolders: true
---
apiVersion: arrchitect.dev/v1alpha1
kind: SonarrDownloadClient
metadata:
  name: sonarr-qbittorrent
  namespace: media
spec:
  sonarrRef:
    name: sonarr
  deletionPolicy: orphan
  name: qBittorrent
  appRef:
    kind: QBittorrent
    name: qbittorrent
  category: tv
  enable: true
