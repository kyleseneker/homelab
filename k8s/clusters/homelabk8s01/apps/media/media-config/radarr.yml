apiVersion: arrchitect.dev/v1alpha1
kind: Radarr
metadata:
  name: radarr
  namespace: media
spec:
  connection:
    url: http://radarr.media.svc.cluster.local:7878
    apiKeySecretRef:
      name: media-api-keys
      key: radarr-api-key
  reconcile:
    intervalSeconds: 300
    deletionPolicy: orphan
  rootFolders:
    - path: /data/media/movies
  downloadClientConfig:
    enableCompletedDownloadHandling: true
    autoRedownloadFailed: true
  notifications:
    - name: Jellyfin
      implementation: MediaBrowser
      configContract: MediaBrowserSettings
      onDownload: true
      onUpgrade: true
      onRename: true
      fields:
        - name: host
          value: jellyfin.media.svc.cluster.local
        - name: port
          value: 8096
        - name: useSsl
          value: false
        - name: updateLibrary
          value: true
        - name: notify
          value: false
        - name: apiKey
          valueFrom:
            secretKeyRef:
              name: jellyfin-credentials
              key: api-key
  mediaManagement:
    downloadPropersAndRepacks: doNotPrefer
---
apiVersion: arrchitect.dev/v1alpha1
kind: RadarrDownloadClient
metadata:
  name: radarr-qbittorrent
  namespace: media
spec:
  radarrRef:
    name: radarr
  deletionPolicy: orphan
  name: qBittorrent
  implementation: QBittorrent
  configContract: QBittorrentSettings
  protocol: torrent
  host: downloads.media.svc.cluster.local
  port: 8080
  category: movies
  enable: true
  usernameSecretRef:
    name: qbittorrent-credentials
    key: username
  passwordSecretRef:
    name: qbittorrent-credentials
    key: password
