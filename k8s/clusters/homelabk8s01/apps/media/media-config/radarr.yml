apiVersion: arrchitect.dev/v1alpha1
kind: Radarr
metadata:
  name: radarr
  namespace: media
spec:
  connection:
    url: http://radarr.media.svc.cluster.local:7878
    apiKeySecretRef:
      name: media-api-keys
      key: radarr-api-key
  reconcile:
    intervalSeconds: 300
    deletionPolicy: orphan
  rootFolders:
    - path: /data/media/movies
  downloadClientConfig:
    enableCompletedDownloadHandling: true
    autoRedownloadFailed: true
  notifications:
    - name: Jellyfin
      appRef:
        kind: Jellyfin
        name: jellyfin
      onDownload: true
      onUpgrade: true
      onRename: true
      fields:
        - name: updateLibrary
          value: true
        - name: notify
          value: false
  mediaManagement:
    downloadPropersAndRepacks: doNotPrefer
    deleteEmptyFolders: true
---
apiVersion: arrchitect.dev/v1alpha1
kind: RadarrDownloadClient
metadata:
  name: radarr-qbittorrent
  namespace: media
spec:
  radarrRef:
    name: radarr
  deletionPolicy: orphan
  name: qBittorrent
  appRef:
    kind: QBittorrent
    name: qbittorrent
  category: movies
  enable: true
