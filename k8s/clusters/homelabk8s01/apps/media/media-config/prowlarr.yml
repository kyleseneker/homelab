apiVersion: arrchitect.dev/v1alpha1
kind: Prowlarr
metadata:
  name: prowlarr
  namespace: media
spec:
  connection:
    url: http://prowlarr.media.svc.cluster.local:9696
    apiKeySecretRef:
      name: media-api-keys
      key: prowlarr-api-key
  reconcile:
    intervalSeconds: 300
    deletionPolicy: orphan
  tags:
    - label: flaresolverr
  proxies:
    - name: flaresolverr
      implementation: FlareSolverr
      configContract: FlareSolverrSettings
      host: http://flaresolverr.media.svc.cluster.local:8191
      requestTimeout: 60
      tagLabels:
        - flaresolverr
  applications:
    - name: Sonarr
      appRef:
        kind: Sonarr
        name: sonarr
      syncLevel: fullSync
      syncCategories: [5000, 5010, 5020, 5030, 5040, 5045, 5050]
    - name: Radarr
      appRef:
        kind: Radarr
        name: radarr
      syncLevel: fullSync
      syncCategories: [2000, 2010, 2020, 2030, 2040, 2045, 2050, 2060]
  indexers:
    - name: YTS
      implementation: Cardigann
      configContract: CardigannSettings
      enable: true
      appProfileName: Standard
      priority: 25
      fields:
        - name: definitionFile
          value: yts
        - name: baseUrl
          value: https://yts.mx/
    - name: LimeTorrents
      implementation: Cardigann
      configContract: CardigannSettings
      enable: true
      appProfileName: Standard
      priority: 25
      fields:
        - name: definitionFile
          value: limetorrents
        - name: baseUrl
          value: https://www.limetorrents.lol/
    - name: Nyaa
      implementation: Cardigann
      configContract: CardigannSettings
      enable: true
      appProfileName: Standard
      priority: 30
      fields:
        - name: definitionFile
          value: nyaasi
        - name: baseUrl
          value: https://nyaa.si/
    - name: 1337x
      implementation: Cardigann
      configContract: CardigannSettings
      enable: true
      appProfileName: Standard
      priority: 25
      tagLabels:
        - flaresolverr
      fields:
        - name: definitionFile
          value: 1337x
        - name: baseUrl
          value: https://1337x.to/
    - name: ThePirateBay
      implementation: Cardigann
      configContract: CardigannSettings
      enable: true
      appProfileName: Standard
      priority: 30
      tagLabels:
        - flaresolverr
      fields:
        - name: definitionFile
          value: thepiratebay
        - name: baseUrl
          value: https://thepiratebay.org/
