apiVersion: arrchitect.dev/v1alpha1
kind: Seerr
metadata:
  name: seerr
  namespace: media
spec:
  connection:
    url: http://seerr.media.svc.cluster.local:80
    apiKeySecretRef:
      name: seerr-api-key
      key: api-key
  reconcile:
    intervalSeconds: 900
    deletionPolicy: orphan
  jellyfinAuth:
    appRef:
      kind: Jellyfin
      name: jellyfin
  main:
    applicationTitle: Seerr
    applicationUrl: https://seerr.home.seneker.io
    localLogin: true
    mediaServerLogin: true
  sonarr:
    - name: Sonarr
      appRef:
        kind: Sonarr
        name: sonarr
      activeProfileName: WEB-1080p
      activeDirectory: /data/media/tv
      enableSeasonFolders: true
      is4k: false
      isDefault: true
  radarr:
    - name: Radarr
      appRef:
        kind: Radarr
        name: radarr
      activeProfileName: HD Bluray + WEB
      activeDirectory: /data/media/movies
      minimumAvailability: released
      is4k: false
      isDefault: true
