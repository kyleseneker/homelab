apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tdarr
  namespace: media
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: tdarr
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: auth
            app.kubernetes.io/name: authentik
            app.kubernetes.io/component: server
      toPorts:
        - ports:
            - port: "8265"
              protocol: TCP
