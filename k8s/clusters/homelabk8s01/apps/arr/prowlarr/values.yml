defaultPodOptions:
  annotations:
    reloader.stakater.com/auto: 'true'
controllers:
  main:
    replicas: 0
    containers:
      main:
        image:
          repository: lscr.io/linuxserver/prowlarr
          tag: 2.5.2
        envFrom:
          - configMapRef:
              name: arr-env
          - secretRef:
              name: arr-prowlarr-env
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - SETUID
              - SETGID
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true
service:
  main:
    controller: main
    ports:
      http:
        port: 9696
route:
  main:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: homelab-gateway
        namespace: default
        sectionName: https
    hostnames:
      - prowlarr.homelab.local
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - name: ak-outpost-authentik-embedded-outpost
            namespace: auth
            port: 9000
persistence:
  config:
    type: persistentVolumeClaim
    existingClaim: arr-prowlarr-config
    globalMounts:
      - path: /config
