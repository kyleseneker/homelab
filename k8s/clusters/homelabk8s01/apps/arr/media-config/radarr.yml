apiVersion: media-operator.dev/v1alpha1
kind: RadarrConfig
metadata:
  name: radarr
  namespace: arr
spec:
  connection:
    url: http://arr-radarr.arr.svc.cluster.local:7878
    apiKeySecretRef:
      name: arr-api-keys
      key: radarr-api-key
  reconcile:
    interval: 5m
    deletionPolicy: orphan
  rootFolders:
    - path: /data/media/movies
  downloadClients:
    - name: qBittorrent
      implementation: QBittorrent
      configContract: QBittorrentSettings
      protocol: torrent
      host: arr-vpn-downloads.arr.svc.cluster.local
      port: 8080
      category: movies
      enable: true
      usernameSecretRef:
        name: qbittorrent-credentials
        key: username
      passwordSecretRef:
        name: qbittorrent-credentials
        key: password
  downloadClientConfig:
    enableCompletedDownloadHandling: true
    autoRedownloadFailed: true
  notifications:
    - name: Jellyfin
      implementation: MediaBrowser
      configContract: MediaBrowserSettings
      onDownload: true
      onUpgrade: true
      onRename: true
      fields:
        - name: host
          value: arr-jellyfin.arr.svc.cluster.local
        - name: port
          value: 8096
        - name: useSsl
          value: false
        - name: updateLibrary
          value: true
        - name: notify
          value: false
        - name: apiKey
          valueFrom:
            name: jellyfin-credentials
            key: api-key
