apiVersion: media-operator.dev/v1alpha1
kind: SeerrConfig
metadata:
  name: seerr
  namespace: arr
spec:
  connection:
    url: http://arr-seerr.arr.svc.cluster.local:80
  reconcile:
    interval: 15m
    deletionPolicy: orphan
  jellyfinAuth:
    hostname: arr-jellyfin.arr.svc.cluster.local
    port: 8096
    useSsl: false
    usernameSecretRef:
      name: jellyfin-credentials
      key: username
    passwordSecretRef:
      name: jellyfin-credentials
      key: password
  main:
    applicationTitle: Seerr
    applicationUrl: https://seerr.homelab.local
    localLogin: true
    mediaServerLogin: true
  sonarr:
    name: Sonarr
    hostname: arr-sonarr.arr.svc.cluster.local
    port: 8989
    useSsl: false
    apiKeySecretRef:
      name: arr-api-keys
      key: sonarr-api-key
    activeProfileName: WEB-1080p
    activeDirectory: /data/media/tv
    enableSeasonFolders: true
    isDefault: true
  radarr:
    name: Radarr
    hostname: arr-radarr.arr.svc.cluster.local
    port: 7878
    useSsl: false
    apiKeySecretRef:
      name: arr-api-keys
      key: radarr-api-key
    activeProfileName: HD Bluray + WEB
    activeDirectory: /data/media/movies
    minimumAvailability: released
    isDefault: true
