apiVersion: media-operator.dev/v1alpha1
kind: TdarrConfig
metadata:
  name: tdarr
  namespace: arr
spec:
  connection:
    url: http://arr-tdarr.arr.svc.cluster.local:8265
    apiKeySecretRef:
      name: tdarr-api-key
      key: api-key
  reconcile:
    interval: 15m
    deletionPolicy: orphan
  workers:
    transcodeGPU: 1
    transcodeCPU: 1
    healthcheckGPU: 1
    healthcheckCPU: 1
  flows:
    - id: hevc-qsv
      name: HEVC QSV
      description: Transcode non-HEVC video to HEVC using Intel QSV, then replace the original.
      flowPlugins:
        - id: n_input
          name: Input File
          pluginName: inputFile
          sourceRepo: Community
          version: 1.0.0
          position:
            x: 0
            y: 0
          fpEnabled: true
          inputsDB:
            fileAccessChecks: 'true'
            pluginOrderPosition: '0'
        - id: n_codec
          name: Already HEVC?
          pluginName: checkVideoCodec
          sourceRepo: Community
          version: 1.0.0
          position:
            x: 0
            y: 200
          fpEnabled: true
          inputsDB:
            codec: hevc
        - id: n_start
          name: Begin ffmpeg Command
          pluginName: ffmpegCommandStart
          sourceRepo: Community
          version: 1.0.0
          position:
            x: 0
            y: 400
          fpEnabled: true
          inputsDB: {}
        - id: n_enc
          name: Set HEVC QSV Encoder
          pluginName: ffmpegCommandSetVideoEncoder
          sourceRepo: Community
          version: 1.0.0
          position:
            x: 0
            y: 600
          fpEnabled: true
          inputsDB:
            outputCodec: hevc
            hardwareEncoding: 'true'
            hardwareType: qsv
            ffmpegPreset: slow
            ffmpegQuality: '20'
            enabledFilters: ''
        - id: n_exec
          name: Execute Transcode
          pluginName: ffmpegCommandExecute
          sourceRepo: Community
          version: 1.0.0
          position:
            x: 0
            y: 800
          fpEnabled: true
          inputsDB: {}
        - id: n_replace
          name: Replace Original File
          pluginName: replaceOriginalFile
          sourceRepo: Community
          version: 1.0.0
          position:
            x: 0
            y: 1000
          fpEnabled: true
          inputsDB: {}
      flowEdges:
        - id: e1
          source: n_input
          sourceHandle: '1'
          target: n_codec
          targetHandle: null
        - id: e2
          source: n_codec
          sourceHandle: '2'
          target: n_start
          targetHandle: null
        - id: e3
          source: n_start
          sourceHandle: '1'
          target: n_enc
          targetHandle: null
        - id: e4
          source: n_enc
          sourceHandle: '1'
          target: n_exec
          targetHandle: null
        - id: e5
          source: n_exec
          sourceHandle: '1'
          target: n_replace
          targetHandle: null
  libraries:
    - id: movies
      name: Movies
      folder: /data/media/movies
      scanOnStart: true
      folderWatching: false
      processLibrary: true
      priority: 1
      flowId: hevc-qsv
      containerFilter: mkv,mp4,m4v,avi,mov,ts,wmv,flv,webm,mpg,mpeg
      scannerThreadCount: 1
      cache: /temp
    - id: tv
      name: TV Shows
      folder: /data/media/tv
      scanOnStart: true
      folderWatching: false
      processLibrary: true
      priority: 1
      flowId: hevc-qsv
      containerFilter: mkv,mp4,m4v,avi,mov,ts,wmv,flv,webm,mpg,mpeg
      scannerThreadCount: 1
      cache: /temp
