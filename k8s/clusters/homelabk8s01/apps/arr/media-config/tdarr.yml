apiVersion: media-operator.dev/v1alpha1
kind: TdarrConfig
metadata:
  name: tdarr
  namespace: arr
spec:
  connection:
    url: http://arr-tdarr.arr.svc.cluster.local:8265
    apiKeySecretRef:
      name: tdarr-api-key
      key: api-key
  reconcile:
    interval: 15m
    deletionPolicy: orphan
  workers:
    transcodeGPU: 1
    transcodeCPU: 0
    healthcheckGPU: 0
    healthcheckCPU: 1
  flows:
    - id: audio-clean
      name: Audio Clean
      description: Drop non-English audio and data streams. Video and remaining audio are copied, not
        re-encoded.
      flowPlugins:
        - id: n_input
          name: Input File
          pluginName: inputFile
          sourceRepo: Community
          version: 1.0.0
          position:
            x: 0
            y: 0
          fpEnabled: true
          inputsDB:
            fileAccessChecks: 'true'
        - id: n_start
          name: Begin ffmpeg Command
          pluginName: ffmpegCommandStart
          sourceRepo: Community
          version: 1.0.0
          position:
            x: 0
            y: 200
          fpEnabled: true
          inputsDB: {}
        - id: n_lang
          name: Drop Foreign Audio
          pluginName: ffmpegCommandRemoveStreamByProperty
          sourceRepo: Community
          version: 1.0.0
          position:
            x: 0
            y: 400
          fpEnabled: true
          inputsDB:
            codecType: audio
            propertyToCheck: tags.language
            valuesToRemove: eng,und
            condition: not_includes
        - id: n_data
          name: Drop Data Streams
          pluginName: ffmpegCommandRemoveDataStreams
          sourceRepo: Community
          version: 1.0.0
          position:
            x: 0
            y: 600
          fpEnabled: true
          inputsDB: {}
        - id: n_exec
          name: Execute Remux
          pluginName: ffmpegCommandExecute
          sourceRepo: Community
          version: 1.0.0
          position:
            x: 0
            y: 800
          fpEnabled: true
          inputsDB: {}
        - id: n_replace
          name: Replace Original File
          pluginName: replaceOriginalFile
          sourceRepo: Community
          version: 1.0.0
          position:
            x: 0
            y: 1000
          fpEnabled: true
          inputsDB: {}
      flowEdges:
        - id: e1
          source: n_input
          sourceHandle: '1'
          target: n_start
          targetHandle: null
        - id: e2
          source: n_start
          sourceHandle: '1'
          target: n_lang
          targetHandle: null
        - id: e3
          source: n_lang
          sourceHandle: '1'
          target: n_data
          targetHandle: null
        - id: e4
          source: n_data
          sourceHandle: '1'
          target: n_exec
          targetHandle: null
        - id: e5
          source: n_exec
          sourceHandle: '1'
          target: n_replace
          targetHandle: null
  libraries:
    - id: movies
      name: Movies
      folder: /data/media/movies
      scanOnStart: true
      folderWatching: false
      processLibrary: true
      priority: 1
      flowId: audio-clean
      containerFilter: mkv,mp4,m4v,avi,mov,ts,wmv,flv,webm,mpg,mpeg
      scannerThreadCount: 1
      cache: /temp
      container: mkv
      processTranscodes: true
      processHealthChecks: true
      decisionMode: flows
      healthCheckMode: thorough
      scheduledScanFindNew: true
    - id: tv
      name: TV Shows
      folder: /data/media/tv
      scanOnStart: true
      folderWatching: false
      processLibrary: true
      priority: 1
      flowId: audio-clean
      containerFilter: mkv,mp4,m4v,avi,mov,ts,wmv,flv,webm,mpg,mpeg
      scannerThreadCount: 1
      cache: /temp
      container: mkv
      processTranscodes: true
      processHealthChecks: true
      decisionMode: flows
      healthCheckMode: thorough
      scheduledScanFindNew: true
