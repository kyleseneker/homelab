apiVersion: apps/v1
kind: Deployment
metadata:
  name: arr-config-backup-holder
  namespace: arr
  labels:
    app.kubernetes.io/name: arr-config-backup
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arr-config-backup-holder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arr-config-backup-holder
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 977
        runAsGroup: 988
        fsGroup: 988
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: holder
          image: registry.k8s.io/pause:3.10
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: backup
              mountPath: /backup
              readOnly: true
      volumes:
        - name: backup
          persistentVolumeClaim:
            claimName: arr-config-backups
