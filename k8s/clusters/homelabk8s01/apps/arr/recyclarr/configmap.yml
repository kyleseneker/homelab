apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr-config
  namespace: arr
data:
  recyclarr.yml: |
    sonarr:
      sonarr-main:
        base_url: http://arr-sonarr.arr.svc.cluster.local:8989
        api_key: !secret sonarr_api_key
        quality_definition:
          type: series
        quality_profiles:
          - name: WEB-1080p
            reset_unmatched_scores:
              enabled: true
            upgrade:
              allowed: true
              until_quality: WEB 1080p
              until_score: 10000
            qualities:
              - name: WEB 1080p
                qualities:
                  - WEBDL-1080p
                  - WEBRip-1080p
        custom_formats:
          # Unwanted
          - trash_ids:
              - 85c61753df5da1fb2aab6f2a47426b09  # BR-DISK
              - 9c11cd3f07101cdba90a2d81cf0e56b4  # LQ
              - e2315f990da2e2cbfc9fa5b7a6fcfe48  # LQ (Release Title)
              - 47435ece6b99a0b477caf360e79ba0bb  # x265 (HD)
              - fbcb31d8dabd2a319072b84fc0b7249c  # Extras
            assign_scores_to:
              - name: WEB-1080p
          # Misc
          - trash_ids:
