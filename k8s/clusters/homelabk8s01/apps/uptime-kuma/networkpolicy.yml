apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: uptime-kuma
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: uptime-kuma
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3001"
              protocol: TCP
  egress:
    - toEntities:
        - cluster
