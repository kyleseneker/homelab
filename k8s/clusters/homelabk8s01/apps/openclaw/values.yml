defaultPodOptions:
  annotations:
    reloader.stakater.com/auto: 'true'
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
controllers:
  main:
    serviceAccount:
      identifier: openclaw
    initContainers:
      tooling:
        image:
          repository: alpine
          tag: '3.24'
        command:
          - /bin/sh
          - -c
        args:
          - |
            set -eu
            # Verify the pinned kubectl artifact before making it executable.
            wget -qO /tools/kubectl https://dl.k8s.io/release/v1.31.4/bin/linux/amd64/kubectl
            wget -qO /tools/kubectl.sha256 https://dl.k8s.io/release/v1.31.4/bin/linux/amd64/kubectl.sha256
            printf '%s  /tools/kubectl\n' "$(cat /tools/kubectl.sha256)" | sha256sum -c -
            chmod +x /tools/kubectl
            wget -qO /tools/kubeconform-linux-amd64.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
            wget -qO /tools/CHECKSUMS https://github.com/yannh/kubeconform/releases/download/v0.6.7/CHECKSUMS
            cd /tools
            grep '  kubeconform-linux-amd64.tar.gz$' CHECKSUMS | sha256sum -c -
            tar xzf kubeconform-linux-amd64.tar.gz kubeconform
            mkdir -p /state/workspace /state/hooks/transforms
            cp /boot/BOOT.md /state/workspace/BOOT.md
            for f in IDENTITY.md SOUL.md USER.md TOOLS.md HEARTBEAT.md WEBHOOKS.md; do
              cp "/workspace-src/$f" "/state/workspace/$f"
            done
            cp /hooks-transforms-src/*.js /state/hooks/transforms/
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      config:
        image:
          repository: ghcr.io/openclaw/openclaw
          tag: 2026.9.6
        command: [node, -e]
        args:
          - |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const path = '/state/openclaw.json';
            const desired = JSON.parse(fs.readFileSync('/config/config.json5', 'utf8'));
            let previous = {};
            if (fs.existsSync(path)) {
              // Preserve the original once for migration rollback; never print credentials.
              previous = JSON.parse(fs.readFileSync(path, 'utf8'));
              if (!fs.existsSync(path + '.pre-gitops')) {
                fs.copyFileSync(path, path + '.pre-gitops', fs.constants.COPYFILE_EXCL);
                fs.chmodSync(path + '.pre-gitops', 0o600);
              }
            }
            const token = previous.gateway?.auth?.token;
            desired.gateway.auth.token = typeof token === 'string' && token.trim()
              ? token : crypto.randomBytes(32).toString('hex');
            fs.writeFileSync(path + '.tmp', JSON.stringify(desired, null, 2) + '\n', {mode: 0o600});
            fs.chmodSync(path + '.tmp', 0o600);
            fs.renameSync(path + '.tmp', path);
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
    containers:
      main:
        image:
          repository: ghcr.io/openclaw/openclaw
          tag: 2026.9.6
        env:
          TZ: America/Chicago
          OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
          OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: '1'
          PATH: /usr/local/bin/tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        envFrom:
          - secretRef:
              name: openclaw-secrets
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            cpu: 1000m
            memory: 2Gi
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - curl
                  - -sf
                  - http://127.0.0.1:18789/healthz
              periodSeconds: 30
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - curl
                  - -sf
                  - http://127.0.0.1:18789/healthz
              periodSeconds: 10
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - curl
                  - -sf
                  - http://127.0.0.1:18789/healthz
              failureThreshold: 30
              periodSeconds: 5
serviceAccount:
  openclaw: {}
service:
  main:
    controller: main
    ports:
      http:
        port: 18789
route:
  main:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: homelab-gateway
        namespace: default
        sectionName: https
    hostnames:
      - openclaw.homelab.local
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - name: openclaw
            port: 18789
persistence:
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
  npm-cache:
    type: emptyDir
    advancedMounts:
      main:
        main:
          - path: /home/node/.npm
  data:
    type: persistentVolumeClaim
    storageClass: nfs-client
    accessMode: ReadWriteOnce
    size: 2Gi
    advancedMounts:
      main:
        config:
          - path: /state
        tooling:
          - path: /state
        main:
          - path: /home/node/.openclaw
  config:
    type: configMap
    name: openclaw-config
    globalMounts:
      - path: /config/config.json5
        subPath: config.json5
        readOnly: true
  skills:
    type: configMap
    name: openclaw-skills
    globalMounts:
      - path: /skills/ops/SKILL.md
        subPath: ops-SKILL.md
        readOnly: true
      - path: /skills/security/SKILL.md
        subPath: security-SKILL.md
        readOnly: true
      - path: /skills/dr/SKILL.md
        subPath: dr-SKILL.md
        readOnly: true
      - path: /skills/media/SKILL.md
        subPath: media-SKILL.md
        readOnly: true
  workspace-src:
    type: configMap
    name: openclaw-workspace
    advancedMounts:
      main:
        tooling:
          - path: /workspace-src
  hooks-transforms-src:
    type: configMap
    name: openclaw-hooks-transforms
    advancedMounts:
      main:
        tooling:
          - path: /hooks-transforms-src
  boot:
    type: configMap
    name: openclaw-boot
    advancedMounts:
      main:
        tooling:
          - path: /boot/BOOT.md
            subPath: BOOT.md
            readOnly: true
  tools:
    type: emptyDir
    advancedMounts:
      main:
        tooling:
          - path: /tools
        main:
          - path: /usr/local/bin/tools
            readOnly: true
