# Read-only diagnosis. Mutations are restricted by the namespaced scale Role below.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openclaw
rules:
  # Read-only: pods
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Read-only: workload status
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  # Read-only: job/cronjob status
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  # Read-only: node status
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # Read-only: core resources
  - apiGroups: [""]
    resources: ["namespaces", "services", "endpoints", "events", "configmaps",
                "persistentvolumes", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  # Read-only: metrics
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  # Read-only: storage
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list"]
  # Read-only: RBAC auditing
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["get", "list"]
  # Read-only: networking
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes", "gateways"]
    verbs: ["get", "list"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["get", "list"]
  # Read-only: ArgoCD
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
  # Read-only: External Secrets
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets", "clustersecretstores"]
    verbs: ["get", "list"]
  # Read-only: Prometheus
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "prometheusrules", "alertmanagers",
                "alertmanagerconfigs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openclaw
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openclaw
subjects:
  - kind: ServiceAccount
    name: openclaw
    namespace: openclaw
---
# Scale only: no pod deletion, exec, workload-template patch, Secrets, or node writes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openclaw-remediation
  namespace: arr
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["arr-flaresolverr", "homepage"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openclaw-remediation
  namespace: arr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openclaw-remediation
subjects:
  - kind: ServiceAccount
    name: openclaw
    namespace: openclaw
