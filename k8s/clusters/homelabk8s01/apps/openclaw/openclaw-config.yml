# Declarative settings for the pinned OpenClaw release. Runtime token stays on the PVC.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: openclaw
data:
  config.json5: |
    {
      "agents": {
        "defaults": {
          "model": {
            "primary": "anthropic/claude-sonnet-4-6"
          },
          "heartbeat": {
            "every": "30m",
            "ackMaxChars": 200
          }
        }
      },
      "channels": {
        "slack": {
          "enabled": true,
          "mode": "socket",
          "dmPolicy": "pairing",
          "groupPolicy": "disabled"
        }
      },
      "gateway": {
        "mode": "local",
        "bind": "lan",
        "port": 18789,
        "auth": {
          "mode": "token"
        },
        "controlUi": {
          "allowedOrigins": [
            "https://openclaw.homelab.local"
          ]
        }
      },
      "hooks": {
        "enabled": true,
        "path": "/webhook",
        "token": "${OPENCLAW_HOOKS_TOKEN}",
        "defaultSessionKey": "hook:ingress",
        "allowedAgentIds": [
          "main"
        ],
        "transformsDir": "~/.openclaw/hooks/transforms",
        "internal": {
          "enabled": true,
          "entries": {
            "boot-md": {
              "enabled": true
            }
          }
        },
        "mappings": [
          {
            "match": {
              "path": "sonarr"
            },
            "action": "agent",
            "agentId": "main",
            "deliver": true,
            "transform": {
              "module": "arr-webhook.js"
            }
          },
          {
            "match": {
              "path": "radarr"
            },
            "action": "agent",
            "agentId": "main",
            "deliver": true,
            "transform": {
              "module": "arr-webhook.js"
            }
          },
          {
            "match": {
              "path": "alertmanager"
            },
            "action": "agent",
            "agentId": "main",
            "deliver": true,
            "transform": {
              "module": "alertmanager-webhook.js"
            }
          }
        ]
      },
      "skills": {
        "load": {
          "extraDirs": [
            "/skills"
          ]
        }
      }
    }
