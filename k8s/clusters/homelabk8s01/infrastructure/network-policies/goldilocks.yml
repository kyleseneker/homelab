apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: goldilocks-default-deny
  namespace: goldilocks
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: false
    egress: false
  ingressDeny:
    - fromEntities:
        - world
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: goldilocks-egress
  namespace: goldilocks
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: false
    egress: false
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - kube-apiserver
