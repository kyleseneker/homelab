apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backups-allow-internal
  namespace: backups
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: backups
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backups-allow-monitoring
  namespace: backups
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backups-egress
  namespace: backups
spec:
  description: "Default egress rules for all backups pods"
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: backups
    - toEntities:
        - kube-apiserver
    - toCIDR:
        - 0.0.0.0/0
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backups-restore-test-egress
  namespace: backups
spec:
  description: "The restore test pushes its results to the Pushgateway"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: restore-test
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus-pushgateway
      toPorts:
        - ports:
            - port: "9091"
              protocol: TCP
