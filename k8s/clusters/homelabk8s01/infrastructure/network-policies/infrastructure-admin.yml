---
# ADR-016: no pod reaches infrastructure administration. Deny rules alone would
# switch every pod to default-deny egress, so enableDefaultDeny is off.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-infrastructure-admin
spec:
  description: "Deny all pods access to the admin ports of the Proxmox host and the NAS, and to the Management VLAN"
  endpointSelector: {}
  enableDefaultDeny:
    egress: false
    ingress: false
  egressDeny:
    - toCIDRSet:
        - cidrGroupRef: proxmox-host
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
            - port: "111"
              protocol: ANY
            - port: "3128"
              protocol: TCP
            - port: "8006"
              protocol: TCP
    - toCIDRSet:
        - cidrGroupRef: nas
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
    - toCIDRSet:
        - cidrGroupRef: management-vlan
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-gateway-console
specs:
  - description: "Deny every pod except unpoller access to the UniFi console, which the gateway firewall opens to the nodes"
    endpointSelector:
      matchExpressions:
        - key: app.kubernetes.io/name
          operator: NotIn
          values:
            - unpoller
    enableDefaultDeny:
      egress: false
      ingress: false
    egressDeny:
      - toCIDRSet:
          - cidrGroupRef: unifi-gateway
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP
  - description: "Deny pods labelled unpoller outside monitoring access to the UniFi console"
    endpointSelector:
      matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
            - unpoller
        - key: k8s:io.kubernetes.pod.namespace
          operator: NotIn
          values:
            - monitoring
    enableDefaultDeny:
      egress: false
      ingress: false
    egressDeny:
      - toCIDRSet:
          - cidrGroupRef: unifi-gateway
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP
