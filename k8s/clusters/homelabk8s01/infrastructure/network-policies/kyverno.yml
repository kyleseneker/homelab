apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kyverno-allow-ingress
  namespace: kyverno
spec:
  description: "Allow ingress from cluster, API server, and host (for webhook calls)"
  endpointSelector: {}
  ingress:
    - fromEntities:
        - cluster
        - kube-apiserver
        - host
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kyverno-egress
  namespace: kyverno
spec:
  description: "Default egress rules for all kyverno pods"
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kyverno
    - toEntities:
        - kube-apiserver
