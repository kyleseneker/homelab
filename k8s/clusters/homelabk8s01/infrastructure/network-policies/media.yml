apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: media-allow-internal
  namespace: media
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: media-allow-monitoring
  namespace: media
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: media-egress
  namespace: media
spec:
  description: "Default egress rules for all media pods"
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
