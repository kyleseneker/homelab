apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: auth-allow-gateway
  namespace: auth
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: auth-allow-internal
  namespace: auth
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: auth
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: auth-egress
  namespace: auth
spec:
  description: "Default egress rules for all auth pods"
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: auth
    - toEntities:
        - kube-apiserver
