config:
  preserve: false
webhookLabels:
  app.kubernetes.io/managed-by: argocd
admissionController:
  # The fail-closed webhook needs a replica during every drain; three is Kyverno's HA minimum.
  replicas: 3
  # Workers alone cannot absorb a drained replica; allow the control plane too.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  podDisruptionBudget:
    enabled: true
    minAvailable: null
    maxUnavailable: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 384Mi
  container:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 384Mi
backgroundController:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 192Mi
cleanupController:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
reportsController:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 192Mi
