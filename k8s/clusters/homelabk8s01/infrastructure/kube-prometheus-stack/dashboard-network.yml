apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-network
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  network.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "title": "Round-trip time (median)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
              "custom": {
                "fillOpacity": 5,
                "lineWidth": 1,
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.5, sum by (target, le) (rate(smokeping_response_duration_seconds_bucket[$__rate_interval])))",
              "legendFormat": "{{target}}"
            }
          ],
          "description": "Median ping time from the cluster to each target. Gateway and NAS cross only the wired LAN; the resolvers add the WAN link and the ISP."
        },
        {
          "title": "Packet loss",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "custom": {
                "fillOpacity": 5,
                "lineWidth": 1,
                "spanNulls": false
              },
              "max": 1
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "1 - (sum by (target) (rate(smokeping_response_duration_seconds_count[$__rate_interval])) / sum by (target) (rate(smokeping_requests_total[$__rate_interval])))",
              "legendFormat": "{{target}}"
            }
          ],
          "description": "Share of pings without a reply. Loss to every resolver but not the gateway points at the WAN link or the ISP."
        },
        {
          "title": "Round-trip time (95th percentile)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
              "custom": {
                "fillOpacity": 5,
                "lineWidth": 1,
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (target, le) (rate(smokeping_response_duration_seconds_bucket[$__rate_interval])))",
              "legendFormat": "{{target}}"
            }
          ],
          "description": "Slowest 5% of pings. Spikes here with a steady median are short lag bursts, such as a saturated WAN link."
        },
        {
          "title": "Internet round-trip distribution",
          "type": "heatmap",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Every ping to the public resolvers, bucketed by round-trip time. A band that widens or lifts shows lag even when the median looks normal.",
          "options": {
            "calculate": false,
            "yAxis": {
              "unit": "s"
            },
            "cellGap": 0,
            "color": {
              "mode": "scheme",
              "scheme": "Oranges",
              "steps": 64
            },
            "tooltip": {
              "mode": "single",
              "yHistogram": true
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "format": "heatmap",
              "legendFormat": "{{le}}",
              "expr": "sum by (le) (increase(smokeping_response_duration_seconds_bucket{scope=\"internet\"}[$__rate_interval]))"
            }
          ]
        },
        {
          "title": "UniFi events",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 16
          },
          "datasource": {
            "type": "loki",
            "uid": "${loki}"
          },
          "description": "Events from the UniFi controller's system log, collected by unpoller and counted by type.",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 60,
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "sum"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${loki}"
              },
              "legendFormat": "{{event}}",
              "expr": "sum by (event) (count_over_time({job=\"unpoller\", application=\"unifi_system_log\"} | json event [$__auto]))"
            }
          ]
        },
        {
          "title": "UniFi event log",
          "type": "logs",
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 24
          },
          "datasource": {
            "type": "loki",
            "uid": "${loki}"
          },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${loki}"
              },
              "expr": "{job=\"unpoller\", application=\"unifi_system_log\"} | json message | line_format \"{{.message}}\""
            }
          ],
          "description": "The controller's events in plain language. Expand a line for every field, such as signal strength and channel use at a disconnect."
        }
      ],
      "refresh": "1m",
      "schemaVersion": 39,
      "tags": [
        "network"
      ],
      "templating": {
        "list": [
          {
            "name": "loki",
            "label": "Logs",
            "type": "datasource",
            "query": "loki",
            "current": {},
            "hide": 0,
            "refresh": 1,
            "regex": "",
            "options": []
          }
        ]
      },
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "Network",
      "uid": "homelab-network",
      "version": 1
    }
