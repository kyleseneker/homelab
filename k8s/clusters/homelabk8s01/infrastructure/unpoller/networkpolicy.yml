apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: unpoller
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: unpoller
  egress:
    - toCIDRSet:
        - cidrGroupRef: unifi-gateway
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
