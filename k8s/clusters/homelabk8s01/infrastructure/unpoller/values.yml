defaultPodOptions:
  annotations:
    reloader.stakater.com/auto: 'true'
  securityContext:
    runAsUser: 65532
    runAsGroup: 65532
    runAsNonRoot: true
controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/unpoller/unpoller
          tag: v5.10.0
        args:
          - --config=/etc/unpoller/up.conf
        envFrom:
          - secretRef:
              name: unpoller
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 192Mi
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 9130
          readiness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 9130
configMaps:
  config:
    data:
      up.conf: |
        [poller]
          quiet = true

        [prometheus]
          http_listen = "0.0.0.0:9130"
          interval = "30s"

        [influxdb]
          disable = true

        [loki]
          url = "http://loki.monitoring.svc.cluster.local:3100"
          interval = "2m"

        [unifi.defaults]
          url = "https://192.168.10.1"
          sites = ["all"]
          save_sites = true
          save_syslog = true
          save_speedtest = true
          skip_device_tags = true
          ssl_cert_paths = ["/etc/unpoller/controller.pem"]
      controller.pem: |
