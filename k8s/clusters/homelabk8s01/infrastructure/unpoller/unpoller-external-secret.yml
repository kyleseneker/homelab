apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpoller
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: unpoller
  data:
    - secretKey: UP_UNIFI_DEFAULT_API_KEY
      remoteRef:
        key: infrastructure/unpoller
        property: api_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
