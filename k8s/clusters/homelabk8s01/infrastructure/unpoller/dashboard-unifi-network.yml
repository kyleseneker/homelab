apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-unifi-network
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  network.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "type": "row",
          "title": "Internet",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "title": "Internet availability",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Share of the gateway's own internet checks that succeeded, per target, on the best-connected WAN.",
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "fillOpacity": 5,
                "lineWidth": 1,
                "spanNulls": true
              },
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (target) (unpoller_device_wan_monitor_availability_percent{monitor_type=\"icmp\"})",
              "legendFormat": "{{target}}"
            }
          ]
        },
        {
          "title": "Internet latency",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "The gateway's average ping time to each target. It is refreshed every minute or two, so it shows sustained slowness, not few-second blips.",
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "fillOpacity": 5,
                "lineWidth": 1,
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (target) (unpoller_device_wan_monitor_latency_average_seconds{monitor_type=\"icmp\"})",
              "legendFormat": "{{target}}"
            }
          ]
        },
        {
          "title": "Speed tests",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Results of the gateway's own speed tests.",
          "fieldConfig": {
            "defaults": {
              "unit": "Mbits",
              "custom": {
                "fillOpacity": 5,
                "lineWidth": 1,
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "unpoller_speedtest_download_mbps > 0",
              "legendFormat": "download {{wan_group}}"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "unpoller_speedtest_upload_mbps > 0",
              "legendFormat": "upload {{wan_group}}"
            }
          ]
        },
        {
          "type": "row",
          "title": "Wi-Fi",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 9
          },
          "panels": []
        },
        {
          "title": "Channel busy time",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 10
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Share of airtime each radio's channel is in use, by this network and neighbours. Every device on a channel shares it; sustained values above about 50% mean slower, laggier Wi-Fi.",
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "fillOpacity": 5,
                "lineWidth": 1,
                "spanNulls": true
              },
              "min": 0,
              "max": 1
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "unpoller_device_radio_channel_utilization_total_ratio",
              "legendFormat": "{{name}} {{band}} GHz"
            }
          ]
        },
        {
          "title": "Devices per radio",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 10
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Wi-Fi devices connected to each radio.",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "fillOpacity": 5,
                "lineWidth": 1,
                "spanNulls": true
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "unpoller_device_radio_stations",
              "legendFormat": "{{name}} {{band}} GHz"
            }
          ]
        },
        {
          "title": "Extender link to the gateway",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 18
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Signal of each extender's wireless link to the Dream Router. Every device on an extender depends on this link; a drop here slows all of them.",
          "fieldConfig": {
            "defaults": {
              "unit": "dBm",
              "custom": {
                "fillOpacity": 5,
                "lineWidth": 1,
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "unpoller_device_uplink_signal_dbm",
              "legendFormat": "{{name}}"
            }
          ]
        },
        {
          "title": "Wi-Fi experience by access point",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 18
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "UniFi's per-device experience score averaged over each access point's devices. It falls with weak signal, retries and latency.",
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "fillOpacity": 5,
                "lineWidth": 1,
                "spanNulls": true
              },
              "min": 0,
              "max": 1
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "avg by (ap_name) (unpoller_client_satisfaction_ratio{wired=\"false\"})",
              "legendFormat": "{{ap_name}}"
            }
          ]
        },
        {
          "title": "Weakest Wi-Fi devices",
          "type": "bargauge",
          "gridPos": {
            "h": 10,
            "w": 12,
            "x": 0,
            "y": 26
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Devices with the lowest signal right now. Below about -70 dBm, drops and retries become likely.",
          "fieldConfig": {
            "defaults": {
              "unit": "dBm",
              "min": -95,
              "max": -30,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": -70
                  },
                  {
                    "color": "green",
                    "value": -60
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "basic",
            "showUnfilled": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "bottomk(12, unpoller_client_radio_signal_db{wired=\"false\"})",
              "legendFormat": "{{name}} ({{ap_name}}, {{radio}})",
              "instant": true
            }
          ]
        },
        {
          "title": "Lowest experience scores",
          "type": "bargauge",
          "gridPos": {
            "h": 10,
            "w": 12,
            "x": 12,
            "y": 26
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Devices UniFi rates worst right now.",
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.8
                  },
                  {
                    "color": "green",
                    "value": 0.95
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "basic",
            "showUnfilled": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "bottomk(12, unpoller_client_satisfaction_ratio{wired=\"false\"})",
              "legendFormat": "{{name}} ({{ap_name}})",
              "instant": true
            }
          ]
        },
        {
          "type": "row",
          "title": "Events",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 36
          },
          "panels": []
        },
        {
          "title": "UniFi events",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 37
          },
          "datasource": {
            "type": "loki",
            "uid": "${loki}"
          },
          "description": "Events from the UniFi controller's system log, collected by unpoller and counted by type.",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 60,
                "stacking": {
                  "mode": "normal"
                }
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "sum"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${loki}"
              },
              "expr": "sum by (event) (count_over_time({job=\"unpoller\", application=\"unifi_system_log\"} | json event [$__auto]))",
              "legendFormat": "{{event}}"
            }
          ]
        },
        {
          "title": "UniFi event log",
          "type": "logs",
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 45
          },
          "datasource": {
            "type": "loki",
            "uid": "${loki}"
          },
          "description": "The controller's events in plain language. Expand a line for every field, such as signal strength and channel use at a disconnect.",
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${loki}"
              },
              "expr": "{job=\"unpoller\", application=\"unifi_system_log\"} | json message | line_format \"{{.message}}\""
            }
          ]
        },
        {
          "type": "row",
          "title": "Devices",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 57
          },
          "panels": []
        },
        {
          "title": "Uptime",
          "type": "bargauge",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 58
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Time since each UniFi device last restarted.",
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "basic",
            "showUnfilled": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "unpoller_device_uptime_seconds",
              "legendFormat": "{{name}}",
              "instant": true
            }
          ]
        }
      ],
      "refresh": "1m",
      "schemaVersion": 39,
      "tags": [
        "network",
        "unifi"
      ],
      "templating": {
        "list": [
          {
            "name": "loki",
            "label": "Logs",
            "type": "datasource",
            "query": "loki",
            "current": {},
            "hide": 0,
            "refresh": 1,
            "regex": "",
            "options": []
          }
        ]
      },
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "Network",
      "uid": "homelab-unifi-network",
      "version": 1
    }
