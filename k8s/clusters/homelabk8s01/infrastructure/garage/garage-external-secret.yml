apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-secrets
  namespace: backups
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: garage-secrets
  data:
    - secretKey: rpcSecret
      remoteRef:
        key: infrastructure/garage
        property: rpcSecret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: adminToken
      remoteRef:
        key: infrastructure/garage
        property: adminToken
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: accessKeyId
      remoteRef:
        key: infrastructure/garage
        property: accessKeyId
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: secretAccessKey
      remoteRef:
        key: infrastructure/garage
        property: secretAccessKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
