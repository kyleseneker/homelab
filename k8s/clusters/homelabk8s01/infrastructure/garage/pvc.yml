# Metadata is an embedded SQLite database; keep it off NFS (ADR-025).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-meta
  namespace: backups
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-data
  namespace: backups
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-client
  resources:
    requests:
      storage: 50Gi
---
# Metadata snapshots live on the NAS so losing the node does not lose the index.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-snapshots
  namespace: backups
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-client
  resources:
    requests:
      storage: 1Gi
