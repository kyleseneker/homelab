apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: sso-protected
  namespace: monitoring
  labels:
    app.kubernetes.io/name: blackbox-exporter
    release: kube-prometheus-stack
spec:
  jobName: sso-protected
  interval: 60s
  module: http_auth_redirect
  prober:
    url: blackbox-exporter-prometheus-blackbox-exporter:9115
  targets:
    staticConfig:
      static:
        - https://sonarr.home.seneker.io
        - https://radarr.home.seneker.io
        - https://prowlarr.home.seneker.io
        - https://bazarr.home.seneker.io
        - https://qbit.home.seneker.io
        - https://tdarr.home.seneker.io
        - https://goldilocks.home.seneker.io
        - https://prometheus.home.seneker.io
        - https://alertmanager.home.seneker.io
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: direct
  namespace: monitoring
  labels:
    app.kubernetes.io/name: blackbox-exporter
    release: kube-prometheus-stack
spec:
  jobName: direct
  interval: 60s
  module: http_2xx
  prober:
    url: blackbox-exporter-prometheus-blackbox-exporter:9115
  targets:
    staticConfig:
      static:
        - https://argocd.home.seneker.io
        - https://home.seneker.io
        - https://grafana.home.seneker.io/api/health
        - https://jellyfin.home.seneker.io/health
        - https://ha.home.seneker.io
