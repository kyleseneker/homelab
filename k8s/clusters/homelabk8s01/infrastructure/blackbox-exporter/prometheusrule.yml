apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: blackbox-exporter
    release: kube-prometheus-stack
spec:
  groups:
    - name: blackbox-exporter
      rules:
        - alert: EndpointProbeFailing
          expr: |
            probe_success == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} is not answering as expected"
            description: >-
              The probe for {{ $labels.instance }} has failed for five minutes. This walks the
              DNS, TLS trust, the Cilium Gateway, and the Authentik outpost where the route is
              proxied. A login redirect does not exercise the protected backend. Compare
              probe_http_status_code against the module the target uses: proxied routes answer
              302 toward Authentik, and a direct route answers 200.
        - alert: EndpointProbeSlow
          expr: |
            probe_duration_seconds > 5
          for: 10m
          labels:
            severity: info
          annotations:
            summary: "{{ $labels.instance }} is answering slowly"
            description: >-
              {{ $labels.instance }} has taken more than five seconds to answer for ten minutes.
              Check DNS, the gateway, and the responding service. The login-redirect probe
              does not establish whether the outpost can reach its backend.
        - alert: EndpointProbeScrapeFailed
          expr: |
            up{job=~"sso-protected|direct"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Probe scrape failed for {{ $labels.instance }}"
            description: "Prometheus cannot collect this probe. Inspect the exporter and scrape errors; probe_success may be absent."
        - alert: EndpointProbeMetricsAbsent
          expr: |
            absent(probe_success{job="sso-protected"})
            or absent(probe_success{job="direct"})
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Endpoint probe metrics missing for {{ $labels.job }}"
            description: "A configured Probe group has no results. Check Probe discovery, exporter readiness, and Prometheus scrape configuration."
        - alert: EndpointCertificateExpiringSoon
          expr: |
            probe_ssl_earliest_cert_expiry - time() < 14 * 24 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} certificate expires within two weeks"
            description: >-
              cert-manager renews these automatically, so this firing means renewal is not
              happening. Check the Certificate resource backing the gateway listener.
