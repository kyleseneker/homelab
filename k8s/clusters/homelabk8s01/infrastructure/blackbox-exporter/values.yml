resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
serviceMonitor:
  enabled: false
  selfMonitor:
    enabled: true
extraConfigmapMounts:
  - name: homelab-ca
    mountPath: /etc/homelab-ca
    configMap: custom-ca-certs
    readOnly: true
config:
  modules:
    http_2xx:
      prober: http
      timeout: 10s
      http:
        valid_http_versions: [HTTP/1.1, HTTP/2.0]
        valid_status_codes: [200]
        follow_redirects: false
        preferred_ip_protocol: ip4
        tls_config:
          ca_file: /etc/homelab-ca/homelab-ca.crt
    http_auth_redirect:
      prober: http
      timeout: 10s
      http:
        valid_http_versions: [HTTP/1.1, HTTP/2.0]
        valid_status_codes: [302]
        follow_redirects: false
        preferred_ip_protocol: ip4
        fail_if_header_not_matches:
          - header: Location
            regexp: '^(/outpost\.goauthentik\.io/start|https://[^/]+/outpost\.goauthentik\.io/start|https://auth\.homelab\.local/application/o/authorize/)'
        tls_config:
          ca_file: /etc/homelab-ca/homelab-ca.crt
