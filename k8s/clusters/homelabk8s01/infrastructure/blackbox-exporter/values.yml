resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
serviceMonitor:
  enabled: false
config:
  modules:
    http_2xx:
      prober: http
      timeout: 10s
      http:
        valid_http_versions: [HTTP/1.1, HTTP/2.0]
        valid_status_codes: [200]
        follow_redirects: false
        preferred_ip_protocol: ip4
        tls_config:
          insecure_skip_verify: true
    http_auth_redirect:
      prober: http
      timeout: 10s
      http:
        valid_http_versions: [HTTP/1.1, HTTP/2.0]
        valid_status_codes: [302]
        follow_redirects: false
        preferred_ip_protocol: ip4
        tls_config:
          insecure_skip_verify: true
