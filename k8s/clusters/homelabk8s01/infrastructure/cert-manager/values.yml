crds:
  enabled: true
prometheus:
  enabled: true
  servicemonitor:
    enabled: true
config:
  enableGatewayAPI: true
# The UniFi gateway's DNS holds internal-only home.seneker.io records, so the
# DNS-01 self-check asks public resolvers instead (ADR-030).
extraArgs:
  - --dns01-recursive-nameservers-only
  - --dns01-recursive-nameservers=1.1.1.1:53,9.9.9.9:53
global:
  podSecurityContext:
    runAsNonRoot: true
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
cainjector:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
webhook:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 64Mi
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
startupapicheck:
  enabled: false
