nameOverride: alloy-syslog
crds:
  create: false
alloy:
  stabilityLevel: experimental
  enableReporting: false
  configMap:
    content: |
      loki.source.syslog "unifi" {
        listener {
          address       = "0.0.0.0:5514"
          protocol      = "udp"
          syslog_format = "raw"
          labels        = { job = "unifi-syslog" }
        }
        forward_to = [loki.process.unifi.receiver]
      }

      loki.process "unifi" {
        stage.regex {
          expression = `^(?:<\d+>)?[A-Z][a-z]{2} +\d+ \d{2}:\d{2}:\d{2} (?P<host>\S+) (?P<message>.*)$`
        }

        stage.regex {
          source     = "message"
          expression = `^CEF:\d+\|[^|]*\|[^|]*\|[^|]*\|(?P<event_id>[^|]*)\|(?P<event_name>[^|]*)\|(?P<cef_severity>[^|]*)\|`
        }

        stage.labels {
          values = { host = "" }
        }

        stage.structured_metadata {
          values = {
            event_id     = "",
            event_name   = "",
            cef_severity = "",
          }
        }

        stage.output {
          source = "message"
        }

        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
  extraPorts:
    - name: syslog
      port: 5514
      targetPort: 5514
      protocol: UDP
  securityContext:
    runAsNonRoot: true
    runAsUser: 473
    runAsGroup: 473
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  mounts:
    extra:
      - name: storage
        mountPath: /tmp/alloy
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
configReloader:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi
controller:
  type: deployment
  replicas: 1
  volumes:
    extra:
      - name: storage
        emptyDir: {}
rbac:
  create: false
serviceMonitor:
  enabled: true
