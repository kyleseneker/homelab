deploymentMode: Monolithic
loki:
  podSecurityContext:
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    runAsNonRoot: true
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: '2024-01-01'
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: filesystem
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  limits_config:
    retention_period: 168h
  rulerConfig:
    alertmanager_url: http://kube-prometheus-stack-alertmanager.monitoring.svc:9093
    # The rules sidecar's folder; the ruler reads <directory>/<tenant>/.
    storage:
      type: local
      local:
        directory: /rules
singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    storageClass: nfs-client
    size: 10Gi
# The rules sidecar reads only ConfigMaps labelled loki_rule in this namespace.
rbac:
  namespaced: true
sidecar:
  rules:
    # Without auth_enabled, every rule belongs to the "fake" tenant.
    folder: /rules/fake
    resource: configmap
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      # The sidecar reconnects its watch every 60s; at 50m those short bursts
      # were throttled in about 90% of CFS periods.
      cpu: 200m
      memory: 128Mi
lokiCanary:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi
chunksCache:
  enabled: false
resultsCache:
  enabled: false
gateway:
  enabled: false
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
monitoring:
  serviceMonitor:
    enabled: true
memberlist:
  service:
    # The single replica is its own only memberlist peer. Resolve it before it
    # is ready so the startup join succeeds at once instead of retrying until
    # then; from chart 13, Loki exits if those retries run out.
    publishNotReadyAddresses: true
