apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unas-snmp
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: unas-snmp
  data:
    - secretKey: UNAS_SNMP_USERNAME
      remoteRef:
        key: infrastructure/unas-snmp
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: UNAS_SNMP_PASSWORD
      remoteRef:
        key: infrastructure/unas-snmp
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
