apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: unas-snmp
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  jobName: unas-snmp
  scrapeInterval: 60s
  scrapeTimeout: 20s
  metricsPath: /snmp
  params:
    auth:
      - unas_v3
    module:
      - system
      - if_mib
      - ucd_la_table
      - ucd_memory
      - ucd_system_stats
      - lm_sensors
  staticConfigs:
    - targets:
        - 192.168.1.158
      labels:
        instance: unas-pro
  relabelings:
    - sourceLabels: [__address__]
      targetLabel: __param_target
    - targetLabel: __address__
      replacement: snmp-exporter-prometheus-snmp-exporter:9116
