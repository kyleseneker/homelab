apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: snmp-exporter
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus-snmp-exporter
  egress:
    - toCIDRSet:
        - cidrGroupRef: nas
      toPorts:
        - ports:
            - port: "161"
              protocol: UDP
