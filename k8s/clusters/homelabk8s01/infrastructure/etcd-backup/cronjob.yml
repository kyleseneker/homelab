apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup
  namespace: backups
spec:
  schedule: 0 2 * * *
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: etcd-backup
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: etcd-backup
        spec:
          nodeSelector:
            node-role.kubernetes.io/control-plane: ''
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              effect: NoSchedule
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: snapshot
              image: registry.k8s.io/etcd:3.5.15-0
              command:
                - etcdctl
                - snapshot
                - save
                - /work/snapshot.db
                - --endpoints=https://$(NODE_IP):2379
                - --cacert=/etc/kubernetes/pki/etcd/ca.crt
                - --cert=/etc/kubernetes/pki/etcd/server.crt
                - --key=/etc/kubernetes/pki/etcd/server.key
              env:
                - name: NODE_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.hostIP
              securityContext:
                runAsUser: 0
                runAsGroup: 1000
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              volumeMounts:
                - name: k8s-pki
                  mountPath: /etc/kubernetes/pki
                  readOnly: true
                - name: work
                  mountPath: /work
            - name: prepare
              image: amazon/aws-cli:2.37.4
              command:
                - python3
                - -u
                - /scripts/backup.py
                - prepare
              securityContext:
                runAsUser: 0
                runAsGroup: 1000
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              volumeMounts:
                - name: k8s-config
                  mountPath: /source/kubernetes
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: snapshots
                  mountPath: /snapshots
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: kubelet-config
                  mountPath: /source/kubelet-config.yaml
                  readOnly: true
                - name: kubeadm-flags
                  mountPath: /source/kubeadm-flags.env
                  readOnly: true
                - name: kubelet-extra
                  mountPath: /source/kubelet-extra.env
                  readOnly: true
                - name: containerd-config
                  mountPath: /source/containerd.toml
                  readOnly: true
                - name: hostname
                  mountPath: /source/hostname
                  readOnly: true
                - name: os-release
                  mountPath: /source/os-release
                  readOnly: true
          containers:
            - name: upload-offsite
              image: amazon/aws-cli:2.37.4
              command:
                - python3
                - -u
                - /scripts/backup.py
                - upload
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: etcd-backup-credentials
                      key: aws_access_key_id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: etcd-backup-credentials
                      key: aws_secret_access_key
                - name: AWS_DEFAULT_REGION
                  value: us-east-1
                - name: S3_BUCKET
                  value: velero-offsite-homelab
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: work
                  mountPath: /work
                  readOnly: true
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: k8s-pki
              hostPath:
                path: /etc/kubernetes/pki
                type: Directory
            - name: snapshots
              persistentVolumeClaim:
                claimName: etcd-snapshots
            - name: tmp
              emptyDir: {}
            - name: kubelet-config
              hostPath:
                path: /var/lib/kubelet/config.yaml
                type: File
            - name: kubeadm-flags
              hostPath:
                path: /var/lib/kubelet/kubeadm-flags.env
                type: File
            - name: kubelet-extra
              hostPath:
                path: /etc/default/kubelet
                type: File
            - name: containerd-config
              hostPath:
                path: /etc/containerd/config.toml
                type: File
            - name: hostname
              hostPath:
                path: /etc/hostname
                type: File
            - name: os-release
              hostPath:
                path: /etc/os-release
                type: File
            - name: k8s-config
              hostPath:
                path: /etc/kubernetes
                type: Directory
            - name: work
              emptyDir:
                sizeLimit: 2Gi
            - name: scripts
              configMap:
                name: etcd-backup-scripts
                defaultMode: 292
