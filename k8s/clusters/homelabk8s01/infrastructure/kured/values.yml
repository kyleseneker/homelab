configuration:
  period: 10m
  timeZone: America/Chicago
  # Clear of the UniFi firmware window, the evening backups and the host's 03:30 patch window.
  startTime: "1:30"
  endTime: "3:00"
  rebootMethod: signal
  useRebootSentinelHostPath: true
  drainTimeout: 30m
  lockTtl: 2h
  lockReleaseDelay: 30m
  annotateNodes: true
  preferNoScheduleTaint: weave.works/kured-node-reboot
  prometheusUrl: http://kube-prometheus-stack-prometheus.monitoring:9090
  # Info-severity rules by name, plus NodeRebootPending, which only clears after the reboot it reports.
  alertFilterRegexp: ^(Watchdog|InfoInhibitor|NodeRebootPending|CPUThrottlingHigh|EndpointProbeSlow|KubeNodeEviction|KubeNodePressure|KubeQuotaAlmostFull|KubeQuotaFullyUsed|KubeletTooManyPods|NodeCPUHighUsage)$
  alertFiringOnly: true
containerSecurityContext:
  privileged: false
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    add:
      - KILL
    drop:
      - ALL
  # containerd's default AppArmor profile denies signals to the unconfined host PID 1.
  appArmorProfile:
    type: Unconfined
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
metrics:
  create: true
service:
  create: true
