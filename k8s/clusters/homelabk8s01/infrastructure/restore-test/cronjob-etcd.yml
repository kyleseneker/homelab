apiVersion: batch/v1
kind: CronJob
metadata:
  name: restore-test-etcd
  namespace: backups
  labels:
    app.kubernetes.io/name: restore-test
spec:
  schedule: 30 2 * * *
  timeZone: Etc/UTC
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: restore-test
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: restore-test
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            node-role.kubernetes.io/control-plane: ''
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              effect: NoSchedule
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restore-test-etcd
              image: python:3.15-alpine
              command:
                - python3
                - /scripts/restore_test_etcd.py
              env:
                - name: SOURCE
                  value: local
                - name: PUSHGATEWAY_URL
                  value: http://pushgateway-prometheus-pushgateway.monitoring.svc:9091
                - name: SNAPSHOTS
                  value: /snapshots
                - name: ETCD_BIN
                  value: /etcd/usr/local/bin
                - name: WORK
                  value: /work
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 2Gi
              volumeMounts:
                - name: snapshots
                  mountPath: /snapshots
                  readOnly: true
                - name: etcd
                  mountPath: /etcd
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: snapshots
              persistentVolumeClaim:
                claimName: etcd-snapshots
                readOnly: true
            - name: etcd
              image:
                reference: registry.k8s.io/etcd:3.6.6-0
                pullPolicy: IfNotPresent
            - name: work
              emptyDir:
                sizeLimit: 2Gi
            - name: scripts
              configMap:
                name: restore-test-scripts
