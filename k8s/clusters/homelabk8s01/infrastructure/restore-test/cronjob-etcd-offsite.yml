apiVersion: batch/v1
kind: CronJob
metadata:
  name: restore-test-etcd-offsite
  namespace: backups
  labels:
    app.kubernetes.io/name: restore-test
spec:
  schedule: 45 2 * * 0
  timeZone: Etc/UTC
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: restore-test
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: restore-test
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restore-test-etcd
              image: amazon/aws-cli:2.40.3
              command:
                - python3
                - /scripts/restore_test_etcd.py
              env:
                - name: SOURCE
                  value: offsite
                - name: PUSHGATEWAY_URL
                  value: http://pushgateway-prometheus-pushgateway.monitoring.svc:9091
                - name: SNAPSHOTS
                  value: /work/download
                - name: BUCKET
                  value: velero-offsite-homelab
                - name: PREFIX
                  value: etcd-snapshots/
                - name: AWS_DEFAULT_REGION
                  value: us-east-1
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: restore-test-aws
                      key: aws_access_key_id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: restore-test-aws
                      key: aws_secret_access_key
                - name: ETCD_BIN
                  value: /etcd/usr/local/bin
                - name: WORK
                  value: /work
                - name: HOME
                  value: /work
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 2Gi
              volumeMounts:
                - name: etcd
                  mountPath: /etcd
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: etcd
              image:
                reference: registry.k8s.io/etcd:3.6.6-0
                pullPolicy: IfNotPresent
            - name: work
              emptyDir:
                sizeLimit: 2Gi
            - name: scripts
              configMap:
                name: restore-test-scripts
