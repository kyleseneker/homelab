apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - storageclass.yml
  - rbac.yml
  - modifiers.yml
  - cronjob.yml
  - restore-test-external-secret.yml
  - restore-test-home-assistant-external-secret.yml
  - cronjob-etcd.yml
  - cronjob-etcd-offsite.yml
  - cronjob-offsite.yml
  - prometheusrule.yml
configMapGenerator:
  - name: restore-test-scripts
    namespace: backups
    files:
      - restore_test.py=scripts/restore_test.py
      - restore_test_etcd.py=scripts/restore_test_etcd.py
      - check_sqlite.py=scripts/check_sqlite.py
      - check_zip.py=scripts/check_zip.py
      - check_ha.py=scripts/check_ha.py
      - check_pgdump.sh=scripts/check_pgdump.sh
      - check_postgres.sh=scripts/check_postgres.sh
      - check_api.py=scripts/check_api.py
      - expected_failures.json=scripts/expected_failures.json
