apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: restore-test-home-assistant
  labels:
    app.kubernetes.io/name: restore-test
spec:
  externalSecretName: restore-test-home-assistant
  namespaceSelectors:
    - matchLabels:
        kubernetes.io/metadata.name: restore-sandbox
  refreshTime: 1m
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: vault-backend
    target:
      name: restore-test-home-assistant
    data:
      - secretKey: backup-encryption-key
        remoteRef:
          key: apps/home-assistant
          property: backup-encryption-key
          conversionStrategy: Default
          decodingStrategy: None
          metadataPolicy: None
