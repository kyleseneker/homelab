apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: auth
data:
  edge-auth.yaml: |
    version: 1
    metadata:
      name: edge-auth
    entries:
      - model: authentik_providers_proxy.proxyprovider
        id: tdarr-provider
        identifiers:
          name: tdarr-edge-auth
        attrs:
          mode: proxy
          external_host: https://tdarr.homelab.local
          internal_host: http://arr-tdarr.arr.svc.cluster.local:8265
          internal_host_ssl_validation: false
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow:
            !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        identifiers:
          slug: tdarr
        attrs:
          name: Tdarr
          provider: !KeyOf tdarr-provider
      - model: authentik_providers_proxy.proxyprovider
        id: goldilocks-provider
        identifiers:
          name: goldilocks-edge-auth
        attrs:
          mode: proxy
          external_host: https://goldilocks.homelab.local
          internal_host: http://goldilocks-dashboard.goldilocks.svc.cluster.local:80
          internal_host_ssl_validation: false
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow:
            !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        identifiers:
          slug: goldilocks
        attrs:
          name: Goldilocks
          provider: !KeyOf goldilocks-provider
      - model: authentik_providers_proxy.proxyprovider
        id: sonarr-provider
        identifiers:
          name: sonarr-edge-auth
        attrs:
          mode: proxy
          external_host: https://sonarr.homelab.local
          internal_host: http://arr-sonarr.arr.svc.cluster.local:8989
          internal_host_ssl_validation: false
          skip_path_regex: |-
            ^/api/.*
            ^/feed/.*
            ^/ping$
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow:
            !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        identifiers:
          slug: sonarr
        attrs:
          name: Sonarr
          provider: !KeyOf sonarr-provider
      - model: authentik_providers_proxy.proxyprovider
        id: radarr-provider
        identifiers:
          name: radarr-edge-auth
        attrs:
          mode: proxy
          external_host: https://radarr.homelab.local
          internal_host: http://arr-radarr.arr.svc.cluster.local:7878
          internal_host_ssl_validation: false
          skip_path_regex: |-
            ^/api/.*
            ^/feed/.*
            ^/ping$
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow:
            !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        identifiers:
          slug: radarr
        attrs:
          name: Radarr
          provider: !KeyOf radarr-provider
      - model: authentik_providers_proxy.proxyprovider
        id: prowlarr-provider
        identifiers:
          name: prowlarr-edge-auth
        attrs:
          mode: proxy
          external_host: https://prowlarr.homelab.local
          internal_host: http://arr-prowlarr.arr.svc.cluster.local:9696
          internal_host_ssl_validation: false
          skip_path_regex: |-
            ^/api/.*
            ^/feed/.*
            ^/ping$
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow:
            !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        identifiers:
          slug: prowlarr
        attrs:
          name: Prowlarr
          provider: !KeyOf prowlarr-provider
      - model: authentik_providers_proxy.proxyprovider
        id: bazarr-provider
        identifiers:
          name: bazarr-edge-auth
        attrs:
          mode: proxy
          external_host: https://bazarr.homelab.local
          internal_host: http://arr-bazarr.arr.svc.cluster.local:6767
          internal_host_ssl_validation: false
          skip_path_regex: |-
            ^/api/.*
            ^/feed/.*
            ^/ping$
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow:
            !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        identifiers:
          slug: bazarr
        attrs:
          name: Bazarr
          provider: !KeyOf bazarr-provider
      - model: authentik_providers_proxy.proxyprovider
        id: qbit-provider
        identifiers:
          name: qbit-edge-auth
        attrs:
          mode: proxy
          external_host: https://qbit.homelab.local
          internal_host: http://arr-vpn-downloads.arr.svc.cluster.local:8080
          internal_host_ssl_validation: false
          skip_path_regex: |-
            ^/api/.*
            ^/feed/.*
            ^/ping$
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow:
            !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        identifiers:
          slug: qbit
        attrs:
          name: qBittorrent
          provider: !KeyOf qbit-provider
      - model: authentik_providers_proxy.proxyprovider
        id: prometheus-provider
        identifiers:
          name: prometheus-edge-auth
        attrs:
          mode: proxy
          external_host: https://prometheus.homelab.local
          internal_host: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          internal_host_ssl_validation: false
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow:
            !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        identifiers:
          slug: prometheus
        attrs:
          name: Prometheus
          provider: !KeyOf prometheus-provider
      - model: authentik_providers_proxy.proxyprovider
        id: alertmanager-provider
        identifiers:
          name: alertmanager-edge-auth
        attrs:
          mode: proxy
          external_host: https://alertmanager.homelab.local
          internal_host: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
          internal_host_ssl_validation: false
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow:
            !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        identifiers:
          slug: alertmanager
        attrs:
          name: Alertmanager
          provider: !KeyOf alertmanager-provider
      - model: authentik_outposts.outpost
        identifiers:
          name: authentik Embedded Outpost
        attrs:
          providers:
            - !KeyOf tdarr-provider
            - !KeyOf goldilocks-provider
            - !KeyOf sonarr-provider
            - !KeyOf radarr-provider
            - !KeyOf prowlarr-provider
            - !KeyOf bazarr-provider
            - !KeyOf qbit-provider
            - !KeyOf prometheus-provider
            - !KeyOf alertmanager-provider
  oidc-clients.yaml: |
    version: 1
    metadata:
      name: oidc-clients
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: argocd-provider
        identifiers:
          name: argocd
        attrs:
          client_type: confidential
          client_id: argocd
          client_secret: !Env ARGOCD_OIDC_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://argocd.homelab.local/auth/callback
            - matching_mode: strict
              url: https://argocd.home.seneker.io/auth/callback
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
          invalidation_flow:
            !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key:
            !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          include_claims_in_id_token: true
          sub_mode: hashed_user_id
          issuer_mode: per_provider
          access_code_validity: minutes=1
          access_token_validity: minutes=60
          refresh_token_validity: days=30
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
      - model: authentik_core.application
        identifiers:
          slug: argocd
        attrs:
          name: ArgoCD
          provider: !KeyOf argocd-provider
      - model: authentik_providers_oauth2.oauth2provider
        id: grafana-provider
        identifiers:
          name: grafana
        attrs:
          client_type: confidential
          client_id: grafana
          client_secret: !Env GRAFANA_OIDC_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://grafana.homelab.local/login/generic_oauth
            - matching_mode: strict
              url: https://grafana.home.seneker.io/login/generic_oauth
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
          invalidation_flow:
            !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key:
            !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          include_claims_in_id_token: true
          sub_mode: hashed_user_id
          issuer_mode: per_provider
          access_code_validity: minutes=1
          access_token_validity: minutes=5
          refresh_token_validity: days=30
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      - model: authentik_core.application
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          provider: !KeyOf grafana-provider
