apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-ldap-outpost
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: authentik-ldap-outpost
  data:
    - secretKey: token
      remoteRef:
        key: infrastructure/authentik-ldap
        property: outpost-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
