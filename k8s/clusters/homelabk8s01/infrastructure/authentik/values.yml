global:
  envFrom:
    - secretRef:
        name: authentik-credentials
  env:
    - name: AUTHENTIK_DISABLE_UPDATE_CHECK
      value: "true"
    - name: AUTHENTIK_ERROR_REPORTING__ENABLED
      value: "false"
server:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
worker:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
postgresql:
  enabled: true
  auth:
    existingSecret: authentik-credentials
    secretKeys:
      adminPasswordKey: postgresql-password
      userPasswordKey: postgresql-password
  primary:
    podSecurityContext:
      enabled: true
      fsGroup: 988
    containerSecurityContext:
      enabled: true
      runAsUser: 977
      runAsGroup: 988
      runAsNonRoot: true
    persistence:
      enabled: true
      storageClass: nfs-client
      size: 5Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 512Mi
