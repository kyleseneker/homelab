blueprints:
  configMaps:
    - authentik-blueprints
global:
  # Restart Authentik when authentik-credentials changes; blueprints read OIDC
  # client secrets from it through !Env.
  deploymentAnnotations:
    reloader.stakater.com/auto: "true"
  envFrom:
    - secretRef:
        name: authentik-credentials
  env:
    - name: AUTHENTIK_DISABLE_UPDATE_CHECK
      value: "true"
    - name: AUTHENTIK_ERROR_REPORTING__ENABLED
      value: "false"
    # Seeds the Base URL system setting on a fresh install; required from 2026.11.
    - name: AUTHENTIK_WEB__BASE_URL
      value: https://auth.homelab.local
server:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
worker:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
postgresql:
  enabled: true
  # Pinned to the Debian 12 build: later charts move to trixie, whose newer glibc
  # changes en_US.utf8 collation and would require reindexing the database.
  image:
    repository: library/postgres
    tag: 17.11-bookworm
  auth:
    existingSecret: authentik-credentials
    secretKeys:
      adminPasswordKey: postgresql-password
      userPasswordKey: postgresql-password
  primary:
    # The subchart defaults to Bitnami's FIPS mode, which the official image does not use.
    fips:
      openssl: "off"
    podSecurityContext:
      enabled: true
      fsGroup: 988
    containerSecurityContext:
      enabled: true
      runAsUser: 977
      runAsGroup: 988
      runAsNonRoot: true
    persistence:
      enabled: true
      storageClass: nfs-client
      size: 5Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 512Mi
