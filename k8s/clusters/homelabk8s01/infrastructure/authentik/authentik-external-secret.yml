apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-credentials
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: authentik-credentials
  data:
    - secretKey: AUTHENTIK_BOOTSTRAP_PASSWORD
      remoteRef:
        key: infrastructure/authentik
        property: AUTHENTIK_BOOTSTRAP_PASSWORD
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: AUTHENTIK_BOOTSTRAP_TOKEN
      remoteRef:
        key: infrastructure/authentik
        property: AUTHENTIK_BOOTSTRAP_TOKEN
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: AUTHENTIK_POSTGRESQL__PASSWORD
      remoteRef:
        key: infrastructure/authentik
        property: AUTHENTIK_POSTGRESQL__PASSWORD
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        key: infrastructure/authentik
        property: AUTHENTIK_SECRET_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: postgresql-password
      remoteRef:
        key: infrastructure/authentik
        property: postgresql-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # OIDC client secrets, read by the oidc-clients blueprint so Authentik and
    # its clients share one Vault source.
    - secretKey: ARGOCD_OIDC_CLIENT_SECRET
      remoteRef:
        key: infrastructure/argocd-oidc
        property: oidc.authentik.clientSecret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: GRAFANA_OIDC_CLIENT_SECRET
      remoteRef:
        key: infrastructure/grafana-oidc
        property: GRAFANA_OIDC_CLIENT_SECRET
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
