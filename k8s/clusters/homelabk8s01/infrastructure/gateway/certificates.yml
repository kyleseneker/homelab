# Gateway certificates are explicit Certificate resources rather than generated
# from Gateway annotations (ADR-030). Apple platforms require the server auth usage.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-gateway-tls
  namespace: default
spec:
  secretName: home-gateway-tls
  dnsNames:
    - "*.home.seneker.io"
    - home.seneker.io
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - digital signature
    - server auth
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
    group: cert-manager.io
