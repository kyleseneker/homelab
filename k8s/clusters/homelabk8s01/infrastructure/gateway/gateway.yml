apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab-gateway
  namespace: default
spec:
  gatewayClassName: cilium
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.homelab.local"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: homelab-gateway-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.homelab.local"
      allowedRoutes:
        namespaces:
          from: All
    - name: https-home
      protocol: HTTPS
      port: 443
      hostname: "*.home.seneker.io"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: home-gateway-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: http-home
      protocol: HTTP
      port: 80
      hostname: "*.home.seneker.io"
      allowedRoutes:
        namespaces:
          from: All
