# Proxy providers answer on one hostname, so the old names of SSO-protected
# apps redirect to their home.seneker.io names.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr-homelab-local
  namespace: default
spec:
  parentRefs:
    - name: homelab-gateway
      sectionName: https
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - sonarr.homelab.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: sonarr.home.seneker.io
            statusCode: 301
---
