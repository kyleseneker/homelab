nameOverride: restore-recyclarr
apiKey:
  existingSecret: restore-recyclarr-secrets
configs:
  existingConfigMap: recyclarr-config
settings:
  content: |
    server:
      schedule:
        enabled: false
      logging:
        files: false
env:
  - name: TZ
    value: America/Chicago
  - name: SONARR_URL
    value: http://restore-sonarr.restore-sonarr.svc.cluster.local:8989
extraVolumes:
  - name: secrets
    secret:
      secretName: restore-recyclarr-secrets
extraVolumeMounts:
  - name: secrets
    mountPath: /config/secrets.yml
    subPath: secrets.yml
    readOnly: true
persistence:
  state:
    storageClass: local-path
    size: 1Gi
serviceMonitor:
  enabled: false
podSecurityContext:
  runAsUser: 977
  runAsGroup: 988
  fsGroup: 988
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi
