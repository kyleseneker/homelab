# Chart 0.34.0 omits FlareSolverr RBAC; scope the workaround to the lab.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: media-operator-indexers-flaresolverr
  namespace: restore-sonarr
rules:
  - apiGroups:
      - media-operator.dev
    resources:
      - flaresolverrconfigs
      - flaresolverrconfigs/status
      - flaresolverrconfigs/finalizers
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: media-operator-indexers-flaresolverr
  namespace: restore-sonarr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: media-operator-indexers-flaresolverr
subjects:
  - kind: ServiceAccount
    name: media-operator-indexers
    namespace: restore-sonarr
