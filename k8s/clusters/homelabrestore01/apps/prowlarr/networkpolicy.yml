---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prowlarr-definitions
  namespace: restore-sonarr
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: restore-prowlarr
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: '*'
    # The definition catalog is required even for the built-in Torznab schema.
    - toFQDNs:
        - matchName: indexers.prowlarr.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
