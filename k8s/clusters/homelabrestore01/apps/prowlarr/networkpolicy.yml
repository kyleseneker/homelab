apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restore-prowlarr-to-restore-sonarr-ingress
  namespace: restore-sonarr
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: restore-sonarr
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: restore-prowlarr
      ports:
        - protocol: TCP
          port: 8989
