controllers:
  main:
    containers:
      main:
        image:
          repository: lscr.io/linuxserver/prowlarr
          tag: 2.5.2
        env:
          TZ: America/Chicago
          PUID: '977'
          PGID: '988'
          PROWLARR__AUTH__METHOD: External
          PROWLARR__AUTH__APIKEY:
            valueFrom:
              secretKeyRef:
                name: restore-prowlarr-api-key
                key: api-key
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - SETUID
              - SETGID
              - CHOWN
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ping
                port: 9696
              periodSeconds: 30
              timeoutSeconds: 15
              failureThreshold: 10
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ping
                port: 9696
              periodSeconds: 15
              timeoutSeconds: 15
              failureThreshold: 5
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ping
                port: 9696
              periodSeconds: 5
              timeoutSeconds: 15
              failureThreshold: 30
service:
  main:
    controller: main
    ports:
      http:
        port: 9696
defaultPodOptions:
  automountServiceAccountToken: false
  securityContext:
    fsGroup: 988
persistence:
  config:
    type: persistentVolumeClaim
    existingClaim: restore-prowlarr-config
    globalMounts:
      - path: /config
