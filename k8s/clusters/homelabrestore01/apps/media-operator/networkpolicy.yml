apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: operator-to-sonarr
  namespace: restore-sonarr
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: restore-sonarr
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: restore-media-operator
      ports:
        - protocol: TCP
          port: 8989
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: media-operator-egress
  namespace: restore-sonarr
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: restore-media-operator
  egress:
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: restore-sonarr
            app.kubernetes.io/name: restore-sonarr
      toPorts:
        - ports:
            - port: "8989"
              protocol: TCP
