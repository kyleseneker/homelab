apiVersion: v1
kind: ServiceAccount
metadata:
  name: restore-vault-snapshot
  namespace: restore-vault
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: restore-vault-snapshot
  namespace: restore-vault
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restore-vault-snapshot
  namespace: restore-vault
spec:
  suspend: true
  schedule: 30 1 * * *
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 180
      template:
        metadata:
          labels:
            app.kubernetes.io/name: restore-vault-snapshot
        spec:
          serviceAccountName: restore-vault-snapshot
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: snapshot
              image: hashicorp/vault:1.21.2
              command:
                - sh
                - -ec
              args:
                - |
                  umask 077
                  VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login \
                    role=restore-vault-snapshot jwt=@/var/run/vault-auth/token)
                  export VAULT_TOKEN
                  staged=/backup/snapshot.tmp
                  trap 'rm -f "$staged"; vault token revoke -self >/dev/null 2>&1 || true' EXIT
                  vault operator raft snapshot save "$staged"
                  vault operator raft snapshot inspect "$staged" >/dev/null
                  archive="/backup/vault-$(date -u +%Y%m%dT%H%M%SZ).snap"
                  test ! -e "$archive"
                  mv "$staged" "$archive"
                  sha256sum "$archive" > "$archive.sha256"
                  echo 'Native Raft snapshot saved and inspected'
              env:
                - name: VAULT_ADDR
                  value: http://restore-vault.restore-vault.svc.cluster.local:8200
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: auth
                  mountPath: /var/run/vault-auth
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: restore-vault-snapshot
            - name: auth
              projected:
                sources:
                  - serviceAccountToken:
                      path: token
                      audience: vault
                      expirationSeconds: 600
            - name: tmp
              emptyDir: {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: restore-vault-snapshot
  namespace: restore-vault
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: restore-vault-snapshot
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: '53'
              protocol: UDP
            - port: '53'
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: restore-vault
            app.kubernetes.io/name: restore-vault
      toPorts:
        - ports:
            - port: '8200'
              protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: snapshot-to-vault
  namespace: restore-vault
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: restore-vault
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: restore-vault-snapshot
      ports:
        - protocol: TCP
          port: 8200
