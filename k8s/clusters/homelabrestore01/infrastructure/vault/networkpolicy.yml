apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: restore-vault
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: restore-vault
  namespace: restore-vault
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: restore-vault
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: restore-vault
            app.kubernetes.io/instance: restore-external-secrets
      toPorts:
        - ports:
            - port: '8200'
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: '53'
              protocol: ANY
          rules:
            dns:
              - matchPattern: '*'
    - toFQDNs:
        - matchName: kms.us-east-1.amazonaws.com
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP
    - toEntities:
        - kube-apiserver
