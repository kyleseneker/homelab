---
- name: Configure Proxmox VE host
  hosts: all
  roles:
    - role: pve_network
      tags: [pve_network]
    - role: pve_firewall
      tags: [pve_firewall]
    - pve_repos
    - role: pve_unattended_upgrades
      tags: [pve_unattended_upgrades]
    - pve_iommu
    - role: pve_serial_console
      tags: [pve_serial_console]
    - role: pve_isolate_cpus
      tags: [pve_isolate_cpus]
    - role: pve_guests_retry
      tags: [pve_guests_retry]
    - role: pve_coredump
      tags: [pve_coredump]
    - role: pve_disable_wireless
      tags: [pve_disable_wireless]
    - role: pve_disable_ksm
      tags: [pve_disable_ksm]
    - role: pve_cloud_init
      when: pve_cloud_init_enabled | default(false) | bool
    - pve_pci_mapping
    - pve_api_token
    - role: pve_ups
      tags: [pve_ups]
    - role: pve_node_exporter
      tags: [pve_node_exporter]
    - role: tfc_agent
      tags: [tfc_agent]
