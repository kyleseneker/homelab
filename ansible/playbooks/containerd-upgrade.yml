---
- name: Upgrade containerd on the control plane before workers
  hosts: control_plane
  serial: 1
  any_errors_fatal: true
  become: true
  roles:
    - containerd_upgrade

- name: Upgrade containerd on workers one at a time
  hosts: workers
  serial: 1
  any_errors_fatal: true
  become: true
  roles:
    - containerd_upgrade
