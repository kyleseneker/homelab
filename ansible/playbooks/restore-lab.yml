---
- name: Prepare isolated recovery machines
  ansible.builtin.import_playbook: restore-lab-prepare.yml

- name: Initialize the recovery control plane
  hosts: control_plane
  become: true
  roles:
    - k8s_control_plane

- name: Join the recovery worker
  hosts: workers
  become: true
  roles:
    - k8s_worker

# As in k8s-cluster.yml: one node at a time, since a kubelet configuration
# change restarts the kubelet. The lab's 32 GiB disks need the image cleanup
# more than production's.
- name: Node disk limits
  hosts: k8s_cluster
  become: true
  serial: 1
  roles:
    - role: k8s_node_disk
      tags:
        - k8s_node_disk
