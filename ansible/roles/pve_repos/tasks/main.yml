---
- name: Remove PVE enterprise repository
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/pve-enterprise.list
    - /etc/apt/sources.list.d/pve-enterprise.sources

- name: Remove Ceph enterprise repository
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/ceph.list
    - /etc/apt/sources.list.d/ceph.sources

- name: Add PVE no-subscription repository
  ansible.builtin.apt_repository:
    repo: "deb http://download.proxmox.com/debian/pve {{ ansible_distribution_release }} pve-no-subscription"
    filename: pve-no-subscription
    state: present

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade Proxmox packages during an explicit maintenance window
  ansible.builtin.apt:
    upgrade: dist
  when: pve_repos_upgrade_packages | default(false) | bool

- name: Install common utilities
  ansible.builtin.apt:
    name: "{{ pve_repos_extra_packages }}"
    state: present
