---
- name: Check if swap is active
  ansible.builtin.command: swapon --show --noheadings
  register: k8s_prereqs_swap_status
  changed_when: false

- name: Disable swap
  ansible.builtin.command: swapoff -a
  changed_when: true
  when: k8s_prereqs_swap_status.stdout | length > 0

- name: Remove swap from fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '\sswap\s'
    state: absent

- name: Load required kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Persist kernel modules across reboots
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"

- name: Set sysctl params for K8s networking
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/k8s.conf
    reload: true
  loop:
    - { key: net.bridge.bridge-nf-call-iptables, value: "1" }
    - { key: net.bridge.bridge-nf-call-ip6tables, value: "1" }
    - { key: net.ipv4.ip_forward, value: "1" }
    - { key: fs.inotify.max_user_instances, value: "512" }
    - { key: fs.inotify.max_user_watches, value: "524288" }

- name: Ensure keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository (for containerd)
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present

- name: Check whether this machine already belongs to a cluster
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: k8s_prereqs_kubelet_identity

- name: Read the initialized node's containerd package version
  ansible.builtin.command: dpkg-query -W -f=${Version} containerd.io
  register: k8s_prereqs_existing_containerd
  changed_when: false
  when: k8s_prereqs_kubelet_identity.stat.exists

- name: Require the containerd upgrade playbook for an initialized node's runtime change
  ansible.builtin.assert:
    that:
      - k8s_prereqs_existing_containerd.stdout.startswith(k8s_prereqs_containerd_version ~ '-')
    fail_msg: Use containerd-upgrade.yml before updating this initialized node's containerd version.
  when: k8s_prereqs_kubelet_identity.stat.exists

- name: Install containerd
  ansible.builtin.apt:
    name: "containerd.io={{ k8s_prereqs_containerd_version }}-*"
    state: present
    update_cache: true
    # Matches the Kubernetes packages: only an unjoined clone may replace a held runtime.
    allow_change_held_packages: "{{ not k8s_prereqs_kubelet_identity.stat.exists }}"

- name: Hold containerd at the pinned version
  ansible.builtin.dpkg_selections:
    name: containerd.io
    selection: hold

- name: Create containerd config directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Check for containerd configuration
  ansible.builtin.stat:
    path: /etc/containerd/config.toml
  register: k8s_prereqs_containerd_config

- name: Check if containerd config has CRI disabled
  ansible.builtin.command: grep -q 'disabled_plugins.*cri' /etc/containerd/config.toml
  register: k8s_prereqs_cri_disabled
  changed_when: false
  failed_when: false

- name: Generate proper containerd config
  ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
  changed_when: true
  when: not k8s_prereqs_containerd_config.stat.exists or k8s_prereqs_containerd_config.stat.size == 0 or k8s_prereqs_cri_disabled.rc == 0
  notify: Restart containerd

- name: Enable SystemdCgroup in containerd
  ansible.builtin.lineinfile:
    path: /etc/containerd/config.toml
    regexp: '^\s*SystemdCgroup\s*='
    line: '            SystemdCgroup = true'
  notify: Restart containerd

- name: Enable containerd service
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true

- name: Flush handlers to restart containerd now
  ansible.builtin.meta: flush_handlers

- name: Add Kubernetes GPG key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_prereqs_version_minor }}/deb/Release.key"
    dest: "/etc/apt/keyrings/kubernetes-v{{ k8s_prereqs_version_minor }}.asc"
    mode: "0644"

- name: Add Kubernetes apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-v{{ k8s_prereqs_version_minor }}.asc] https://pkgs.k8s.io/core:/stable:/v{{ k8s_prereqs_version_minor }}/deb/ /"
    state: present

- name: Read the initialized node's kubelet version
  ansible.builtin.command: kubelet --version
  register: k8s_prereqs_existing_version
  changed_when: false
  when: k8s_prereqs_kubelet_identity.stat.exists

- name: Require the upgrade playbook for an initialized node's version change
  ansible.builtin.assert:
    that:
      - k8s_prereqs_existing_version.stdout == 'Kubernetes v' ~ k8s_prereqs_version
    fail_msg: Use k8s-upgrade.yml before updating this initialized node's bootstrap version.
  when: k8s_prereqs_kubelet_identity.stat.exists

- name: Install kubeadm, kubelet, kubectl
  ansible.builtin.apt:
    name:
      - "kubelet={{ k8s_prereqs_version }}*"
      - "kubeadm={{ k8s_prereqs_version }}*"
      - "kubectl={{ k8s_prereqs_version }}*"
    state: present
    update_cache: true
    # A clone may contain held packages from an older image. Only an unjoined
    # machine can replace them here; existing nodes use k8s-upgrade.yml.
    allow_change_held_packages: "{{ not k8s_prereqs_kubelet_identity.stat.exists }}"

- name: Hold kubeadm, kubelet, kubectl at current version
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

- name: Read kubeadm's images for the pinned Kubernetes version
  ansible.builtin.command: kubeadm config images list --kubernetes-version v{{ k8s_prereqs_version }}
  register: k8s_prereqs_kubeadm_images
  changed_when: false

# containerd's generated default follows its own release, so pin the sandbox to kubeadm's.
- name: Use kubeadm's pause image as the containerd sandbox
  ansible.builtin.lineinfile:
    path: /etc/containerd/config.toml
    regexp: '^(\s*)sandbox\s*='
    line: "\\1sandbox = '{{ k8s_prereqs_kubeadm_images.stdout_lines | select('search', '/pause:') | first }}'"
    backrefs: true
  notify: Restart containerd

- name: Allow unsafe sysctls for VPN containers
  ansible.builtin.lineinfile:
    path: /etc/default/kubelet
    regexp: '^KUBELET_EXTRA_ARGS='
    line: 'KUBELET_EXTRA_ARGS=--allowed-unsafe-sysctls=net.ipv4.conf.all.src_valid_mark'
    create: true
    mode: "0644"
  notify: Restart kubelet

- name: Enable kubelet service
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
