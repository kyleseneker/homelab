---
- name: Create the pve-guests drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/pve-guests.service.d
    state: directory
    mode: "0755"

# A faulty core once crashed the autostart at boot; see Known Issues in the hardware reference.
- name: Retry guest autostart when it fails
  ansible.builtin.copy:
    dest: /etc/systemd/system/pve-guests.service.d/retry.conf
    content: |
      [Unit]
      StartLimitIntervalSec=10min
      StartLimitBurst=4

      [Service]
      Restart=on-failure
      RestartSec=15s
    mode: "0644"
  register: pve_guests_retry_dropin

- name: Reload systemd # noqa: no-handler
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: pve_guests_retry_dropin.changed
