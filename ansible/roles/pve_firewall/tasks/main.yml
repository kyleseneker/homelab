---
# Proxmox adds local_network to the management set, so without both the host
# firewall still allows SSH and the web UI from the whole detected network.
- name: Require a management set and local_network before enabling the host firewall
  ansible.builtin.assert:
    that:
      - pve_firewall_management_sources | length > 0
      - pve_firewall_local_network | length > 0
  when: pve_firewall_host_enabled | bool

# /etc/pve is the cluster filesystem: no atomic renames, and it sets its own file modes.
- name: Write the host firewall # noqa: risky-file-permissions
  ansible.builtin.template:
    src: host.fw.j2
    dest: "/etc/pve/nodes/{{ pve_firewall_node }}/host.fw"
    unsafe_writes: true

- name: Write the datacenter firewall # noqa: risky-file-permissions
  ansible.builtin.template:
    src: cluster.fw.j2
    dest: /etc/pve/firewall/cluster.fw
    unsafe_writes: true
