---
- name: Require a private UPS monitor password
  ansible.builtin.assert:
    that:
      - pve_ups_upsmon_password | length >= 16
      - pve_ups_upsmon_password is match('^[A-Za-z0-9_-]+$')
    fail_msg: Store vault_pve_ups_upsmon_password in Ansible Vault (at least 16 letters, digits, underscores or hyphens).
  no_log: true

- name: Install the kyleseneker apt repository key
  ansible.builtin.copy:
    src: kyleseneker-apt.asc
    dest: /etc/apt/keyrings/kyleseneker-apt.asc
    owner: root
    group: root
    mode: "0644"

- name: Add the kyleseneker apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/kyleseneker.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: {{ pve_ups_apt_repo_url }}
      Suites: {{ ansible_facts['distribution_release'] }}
      Components: main
      Signed-By: /etc/apt/keyrings/kyleseneker-apt.asc

- name: Limit the kyleseneker apt repository to NUT
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/kyleseneker
    owner: root
    group: root
    mode: "0644"
    content: |
      Package: *
      Pin: release o=kyleseneker
      Pin-Priority: 1

      Package: nut nut-client nut-server libupsclient7 libnutscan4
      Pin: release o=kyleseneker
      Pin-Priority: 500

- name: Install NUT packages
  ansible.builtin.apt:
    name:
      - "nut={{ pve_ups_nut_version }}"
      - "nut-client={{ pve_ups_nut_version }}"
      - "nut-server={{ pve_ups_nut_version }}"
    update_cache: true
  notify:
    - Restart nut-driver
    - Restart nut-server
    - Restart nut-monitor

- name: Add udev rule for UPS USB access
  ansible.builtin.template:
    src: ups-udev.rules.j2
    dest: /etc/udev/rules.d/99-ups.rules
    owner: root
    group: root
    mode: "0644"
  notify: Reload udev rules

- name: Deploy graceful shutdown script
  ansible.builtin.template:
    src: nut-shutdown.sh.j2
    dest: /usr/local/sbin/nut-shutdown.sh
    owner: root
    group: root
    mode: "0755"

- name: Configure NUT mode
  ansible.builtin.template:
    src: nut.conf.j2
    dest: /etc/nut/nut.conf
    owner: root
    group: nut
    mode: "0640"
  notify:
    - Restart nut-driver
    - Restart nut-server
    - Restart nut-monitor

- name: Configure UPS device
  ansible.builtin.template:
    src: ups.conf.j2
    dest: /etc/nut/ups.conf
    owner: root
    group: nut
    mode: "0640"
  notify: Restart nut-driver

- name: Configure upsd listener
  ansible.builtin.template:
    src: upsd.conf.j2
    dest: /etc/nut/upsd.conf
    owner: root
    group: nut
    mode: "0640"
  notify: Restart nut-server

- name: Configure upsd users
  ansible.builtin.template:
    src: upsd.users.j2
    dest: /etc/nut/upsd.users
    owner: root
    group: nut
    mode: "0640"
  no_log: true
  notify: Restart nut-server

- name: Configure upsmon
  ansible.builtin.template:
    src: upsmon.conf.j2
    dest: /etc/nut/upsmon.conf
    owner: root
    group: nut
    mode: "0640"
  no_log: true
  notify: Restart nut-monitor

- name: Enable nut-server service
  ansible.builtin.systemd:
    name: nut-server
    enabled: true

- name: Enable nut-monitor service
  ansible.builtin.systemd:
    name: nut-monitor
    enabled: true

- name: Enable nut-driver target
  ansible.builtin.systemd:
    name: nut-driver.target
    enabled: true
