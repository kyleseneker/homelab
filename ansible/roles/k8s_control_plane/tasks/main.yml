---
- name: Check if cluster is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: k8s_control_plane_init_check

- name: Create audit policy directory
  ansible.builtin.file:
    path: /etc/kubernetes/audit
    state: directory
    mode: "0755"

- name: Create audit log directory
  ansible.builtin.file:
    path: /var/log/kubernetes/audit
    state: directory
    mode: "0755"

- name: Deploy audit policy
  ansible.builtin.template:
    src: audit-policy.yml.j2
    dest: /etc/kubernetes/audit/audit-policy.yml
    mode: "0644"

- name: Deploy kubeadm configuration
  ansible.builtin.template:
    src: kubeadm-config.yml.j2
    dest: /etc/kubernetes/kubeadm-config.yml
    mode: "0644"
  when: not k8s_control_plane_init_check.stat.exists

- name: Initialize the Kubernetes control plane
  ansible.builtin.command: >
    kubeadm init --config=/etc/kubernetes/kubeadm-config.yml
  register: k8s_control_plane_init
  changed_when: true
  when: not k8s_control_plane_init_check.stat.exists

- name: Create .kube directory for media user
  ansible.builtin.file:
    path: /home/media/.kube
    state: directory
    owner: media
    group: media
    mode: "0755"

- name: Copy kubeconfig to media user
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/media/.kube/config
    remote_src: true
    owner: media
    group: media
    mode: "0600"

- name: Create .kube directory for root
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    mode: "0755"

- name: Copy kubeconfig to root
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: true
    mode: "0600"

- name: Install Cilium CLI
  ansible.builtin.shell: |
    set -euo pipefail
    CILIUM_CLI_VERSION=$(curl -s https://raw.githubusercontent.com/cilium/cilium-cli/main/stable.txt)
    curl -L --fail --remote-name-all \
      https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-amd64.tar.gz{,.sha256sum}
    sha256sum --check cilium-linux-amd64.tar.gz.sha256sum
    tar xzvf cilium-linux-amd64.tar.gz -C /usr/local/bin
    rm -f cilium-linux-amd64.tar.gz cilium-linux-amd64.tar.gz.sha256sum
  args:
    creates: /usr/local/bin/cilium
    executable: /bin/bash

- name: Wait for the API server after initialization or a node reboot
  ansible.builtin.command: >-
    kubectl --kubeconfig=/etc/kubernetes/admin.conf --request-timeout=5s
    get --raw=/readyz
  register: k8s_control_plane_api_ready
  changed_when: false
  retries: 30
  delay: 5
  until: k8s_control_plane_api_ready.rc == 0

- name: Check for an existing Cilium Helm release
  ansible.builtin.command: >
    kubectl --kubeconfig=/etc/kubernetes/admin.conf -n kube-system
    get secret -l owner=helm,name=cilium -o name
  register: k8s_control_plane_cilium_release
  changed_when: false

- name: Copy vendored Gateway API CRDs for first Cilium installation
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../k8s/components/gateway-api/"
    dest: /etc/kubernetes/gateway-api/
    mode: "0644"
    directory_mode: "0755"
  when: k8s_control_plane_cilium_release.stdout | length == 0

- name: Install Gateway API CRDs before first Cilium installation
  ansible.builtin.command: >
    kubectl --kubeconfig=/etc/kubernetes/admin.conf apply --server-side
    --field-manager=argocd-controller -f /etc/kubernetes/gateway-api/
  register: k8s_control_plane_gateway_crds
  changed_when: "'serverside-applied' in k8s_control_plane_gateway_crds.stdout"
  when: k8s_control_plane_cilium_release.stdout | length == 0

- name: Wait for Gateway API CRDs before first Cilium installation
  ansible.builtin.command: >
    kubectl --kubeconfig=/etc/kubernetes/admin.conf wait
    --for=condition=Established --timeout=120s -f /etc/kubernetes/gateway-api/
  changed_when: false
  when: k8s_control_plane_cilium_release.stdout | length == 0

- name: Copy shared Cilium values
  ansible.builtin.copy:
    src: "{{ k8s_control_plane_cilium_values_file }}"
    dest: /etc/kubernetes/cilium-values.yml
    mode: "0644"

- name: Install Cilium into the cluster
  ansible.builtin.command: >
    cilium install --version {{ k8s_control_plane_cilium_version }}
    --values /etc/kubernetes/cilium-values.yml
    --set k8sServiceHost={{ ansible_host }}
    --set k8sServicePort=6443
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: k8s_control_plane_cilium_install
  changed_when: true
  when: k8s_control_plane_cilium_release.stdout | length == 0

- name: Wait for Cilium to be ready
  ansible.builtin.command: cilium status --wait
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false
  retries: 10
  delay: 15
  register: k8s_control_plane_cilium_status
  until: k8s_control_plane_cilium_status.rc == 0

- name: Generate join command
  ansible.builtin.command: kubeadm token create --print-join-command
  register: k8s_control_plane_join_command_raw
  changed_when: false
  no_log: true

- name: Store join command as fact
  ansible.builtin.set_fact:
    k8s_control_plane_join_command: "{{ k8s_control_plane_join_command_raw.stdout }}"
  no_log: true
