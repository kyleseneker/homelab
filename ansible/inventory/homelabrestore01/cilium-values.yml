---
kubeProxyReplacement: true
gatewayAPI:
  enabled: false
l2announcements:
  enabled: false
operator:
  replicas: 1
ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - 172.24.0.0/16
    clusterPoolIPv4MaskSize: 24
# ADR-028: Multus adds its own CNI configuration, with Cilium as the default network.
cni:
  exclusive: false
# Only the primary NIC carries Cilium traffic, so a VLAN 20 NIC never does.
devices:
  - eth0
