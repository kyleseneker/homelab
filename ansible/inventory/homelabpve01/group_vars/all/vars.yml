---
tfc_agent_token: "{{ vault_tfc_agent_token }}"
# ADR-016 hypervisor enforcement; see the hypervisor isolation runbook.
pve_firewall_enabled: true
pve_firewall_host_enabled: true
# The single node's cluster network; the default is the whole Homelab VLAN, nodes and pods included.
pve_firewall_local_network: 192.168.99.0/24
pve_firewall_management_sources:
  - cidr: 192.168.10.160/27
    comment: Workstation DHCP block
  - cidr: 192.168.3.0/24
    comment: WireGuard VPN clients
  - cidr: 192.168.99.0/24
    comment: Management VLAN
pve_firewall_host_rules:
  - rule: IN ACCEPT -source 192.168.10.50,192.168.10.51,192.168.10.52 -p tcp -dport 3493,9100 -log nolog
    comment: "Cluster monitoring: NUT and node-exporter"
  - rule: IN ACCEPT -p icmp -log nolog
    comment: Ping
pve_network_vlan_aware: true
# ADR-028: VLAN 20 reaches the workers' IoT NICs as access ports.
pve_network_trunk_vlans:
  - 99
  - 20
# Core 12 corrupts memory under load; see Known Issues in the hardware reference.
pve_isolate_cpus_list: "6,7"
# Keeps the favored cores off their 5.4 GHz bin; see Known Issues in the hardware reference.
pve_cpufreq_max_khz: 5200000
# Kernel 7.0 is untested here; the patch window keeps booting the newest 6.17.
pve_patch_window_kernel_series: "6.17"
